<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doshomik Schema Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* One idea per screen: Home → Tour (step by step), Explore (area → table → one tab), Reference (one topic per page). */
:root{
  --bg:#F6F7F4;          /* the app's own background */
  --surface:#FFFFFF;
  --ink:#1D2A2A;
  --ink-2:#465655;
  --muted:#6C7978;
  --line:#DDE3DF;
  --accent:#0E6E62;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3F0EC;
  --cascade:#B2432F; --cascade-soft:#F7E6E2;
  --setnull:#8C6400; --setnull-soft:#F5EDD9;
  --restrict:#56626D; --restrict-soft:#E8EBEE;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121817; --surface:#1A2221; --ink:#E4ECEA; --ink-2:#B5C2BF; --muted:#86938F; --line:#2B3634;
    --accent:#5CC3B2; --accent-ink:#0C1514; --accent-soft:#1D3330;
    --cascade:#E58C7A; --cascade-soft:#3A2622; --setnull:#D9B45E; --setnull-soft:#352D1A; --restrict:#A2AEB9; --restrict-soft:#262E35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1A2221; --ink:#E4ECEA; --ink-2:#B5C2BF; --muted:#86938F; --line:#2B3634;
  --accent:#5CC3B2; --accent-ink:#0C1514; --accent-soft:#1D3330;
  --cascade:#E58C7A; --cascade-soft:#3A2622; --setnull:#D9B45E; --setnull-soft:#352D1A; --restrict:#A2AEB9; --restrict-soft:#262E35;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h1{font-size:2rem;letter-spacing:-.01em;margin-bottom:14px}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0 0 1em;max-width:68ch}
code,.t{font-family:var(--mono);font-size:.92em}
code{background:var(--accent-soft);color:var(--ink);padding:.05em .35em;border-radius:5px}
ul,ol{padding-left:1.2em}

/* ---- top bar ---- */
.bar{border-bottom:1px solid var(--line);background:var(--surface)}
.bar-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;justify-content:space-between}
.brand{font-weight:700;color:var(--ink);text-decoration:none}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.95rem}
nav.main a:hover{background:var(--accent-soft);color:var(--ink)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}

main{max-width:760px;margin:0 auto;padding:36px 20px 80px}
.lede{font-size:1.15rem;color:var(--ink-2)}
.crumbs{font-size:.92rem;color:var(--muted);margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.crumbs span[aria-hidden]{opacity:.6}
.hint{color:var(--muted);font-size:.95rem}
.stack > * + *{margin-top:14px}
.block{margin-top:34px}
.block > h2{margin-bottom:12px}

/* ---- home: three ways in ---- */
.paths{display:grid;gap:14px;margin-top:28px}
.path{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.path:hover{border-color:var(--accent)}
.path b{display:block;font-size:1.2rem;margin-bottom:2px}
.path span{color:var(--ink-2)}
.path.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path.primary span{color:inherit;opacity:.9}

/* ---- the tour: a row of cells that fills in ---- */
.row-progress{display:grid;grid-template-columns:repeat(var(--n),1fr);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:10px}
.row-progress a{height:22px;border-left:1.5px solid var(--ink);background:var(--surface)}
.row-progress a:first-child{border-left:none}
.row-progress a.done{background:var(--accent)}
.row-progress a.now{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.step-count{font-size:.92rem;color:var(--muted);margin:0 0 26px}
.tour h1{margin-bottom:16px}
.tour .visual{margin:26px 0}
.tour-nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.btn{display:inline-block;font:inherit;font-weight:600;padding:10px 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn[aria-disabled="true"]{visibility:hidden}

/* ---- small visual pieces ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.92rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.flow b{font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.flow i{font-style:normal;color:var(--muted)}
.demo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:520px}
.demo table{border-collapse:collapse;width:100%}
.demo th,.demo td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.demo tr:last-child td{border-bottom:none}
.demo th{font-size:.9rem;color:var(--muted);font-weight:600}
.demo td{font-family:var(--mono);font-size:.95rem}
.three{display:grid;gap:12px}
.rule{border-left:5px solid;border-radius:10px;padding:12px 16px}
.rule b{display:block}
.rule.cascade{border-color:var(--cascade);background:var(--cascade-soft)}
.rule.setnull{border-color:var(--setnull);background:var(--setnull-soft)}
.rule.restrict{border-color:var(--restrict);background:var(--restrict-soft)}
.areas{display:grid;gap:8px;padding:0;list-style:none;margin:0}
.areas li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.areas li span{color:var(--muted)}

/* ---- lists of things to open ---- */
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.list > li{border-bottom:1px solid var(--line)}
.list a.item{display:block;padding:16px 4px;text-decoration:none;color:var(--ink)}
.list a.item:hover{background:var(--surface)}
.list a.item b{display:block;font-size:1.08rem}
.list a.item b.t{font-weight:500}
.list a.item span{color:var(--ink-2);font-size:.97rem}
.list a.item small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.search{width:100%;font:inherit;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin:18px 0 8px}
.search:focus{border-color:var(--accent);outline:none}

/* ---- table page ---- */
.table-title{font-family:var(--mono);font-weight:500;font-size:2rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 24px;border-bottom:1px solid var(--line)}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--ink-2);padding:0;list-style:none;margin:0 0 24px}
.facts b{color:var(--ink)}
.know{padding-left:1.1em}
.know li{margin-bottom:10px}
.cols{list-style:none;padding:0;margin:0}
.cols li{padding:14px 0;border-bottom:1px solid var(--line)}
.cols li:first-child{padding-top:0}
.col-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.col-head .t{font-weight:500;font-size:1.02rem}
.col-head .type{color:var(--muted);font-size:.88rem;font-family:var(--mono)}
.cols p{margin:4px 0 0;color:var(--ink-2)}
.pill{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.key{border-color:var(--accent);color:var(--accent)}
.pill.p-new,.pill.new{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.links{list-style:none;padding:0;margin:0}
.links li{padding:12px 14px;border-radius:10px;border-left:5px solid;margin-bottom:10px;background:var(--surface)}
.links li.cascade{border-color:var(--cascade)}
.links li.setnull{border-color:var(--setnull)}
.links li.restrict{border-color:var(--restrict)}
.links li small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted);margin:0 0 16px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.next{margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}

details{border-bottom:1px solid var(--line)}
details:first-of-type{border-top:1px solid var(--line)}
/* A small chevron inside the column (the default marker hangs outside it); it turns when the row opens. */
summary{cursor:pointer;padding:14px 4px;font-weight:600;list-style:none;display:flex;align-items:baseline;gap:12px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(-45deg);transition:transform .15s}
details[open] > summary::before{transform:translateY(-4px) rotate(45deg)}
summary:hover::before{border-color:var(--accent)}
summary small{font-weight:400;color:var(--muted)}
details > .inner{padding:0 4px 18px}
details > .inner p:last-child{margin-bottom:0}
.ba{display:grid;gap:10px}
.ba div{border-radius:10px;padding:10px 14px}
.ba .before{background:var(--cascade-soft)}
.ba .after{background:var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{font:inherit;font-size:.92rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{color:var(--muted);padding:18px 4px}

footer{max-width:760px;margin:0 auto;padding:0 20px 48px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){
  body{font-size:16px}
  h1,.table-title{font-size:1.6rem}
  main{padding:26px 16px 64px}
  .bar-in{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home">Doshomik schema guide</a>
    <nav class="main" aria-label="Main">
      <a href="#home" data-nav="home">Home</a>
      <a href="#tour/1" data-nav="tour">Tour</a>
      <a href="#explore" data-nav="explore">Explore</a>
      <a href="#ref" data-nav="ref">Reference</a>
    </nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer>Source of truth: the SQL files in <code>apps/api/migrations/</code>. Tables, columns and delete rules here were checked against the migrated database on 23 Nov 2026 (migration 005).</footer>

<script>
/* ============================================================
   Schema data, transcribed from apps/api/migrations/*.sql.
   k: 'pk' | 'fk' | 'u', combined with '+', e.g. 'pk+fk'.
   fks[].d: 'cascade' | 'setnull' | 'restrict' (NO ACTION, the default).
   isNew: added in migration 004.
   ============================================================ */
const DOMAINS = [
  {id:'auth',    name:'Accounts & auth',  desc:'Accounts, signed-in devices, outside sign-in links and one-time email codes.'},
  {id:'social',  name:'Social & safety',  desc:'The follow graph, two-way blocks and the moderation queue.'},
  {id:'feed',    name:'Posts & activity', desc:'Posts, likes, saves, comments on posts and papers, and the notification inbox.'},
  {id:'media',   name:'Media',            desc:'Every upload, whatever uses it. Storage keys only, never URLs.'},
  {id:'learn',   name:'Learn',            desc:'Topics (concepts), learn items, courses, completions and "I already know this".'},
  {id:'practice',name:'Practice',         desc:'Questions by topic, quizzes built from them, and every attempt.'},
  {id:'research',name:'Research',         desc:'Topic chips, the paper collection, bilingual Paper Cards, lineage, saves, the three-step tracker, trails and saved AI outputs.'},
  {id:'system',  name:'System',           desc:'The outbox the worker reads and the audit trail. Both outlive what they point at.'}
];

const PUB = [
  {n:'status',t:'text',note:'draft · published · archived'},
  {n:'published_at',t:'timestamptz',note:'Set when it first goes live'},
  {n:'created_by',t:'bigint',k:'fk',note:'Staff author'},
  {n:'updated_by',t:'bigint',k:'fk',note:'Last staff editor'},
  {n:'updated_at',t:'timestamptz'}
];
const PUBFK = [{c:'created_by',to:'users',d:'setnull'},{c:'updated_by',to:'users',d:'setnull'}];

const TABLES = [
/* ---------- auth ---------- */
{
  name:'users', domain:'auth', purpose:'One row per account. The hub of the schema.',
  badges:['public_id','soft delete','stored counts'],
  columns:[
    {n:'id',t:'bigint',k:'pk',note:'Joins only; never sent to clients'},
    {n:'public_id',t:'uuid',k:'u',note:'Exposed as <code>id</code> in the API'},
    {n:'username',t:'text',k:'u',note:'Also unique on <code>lower(username)</code>; trigram indexed'},
    {n:'email',t:'text',k:'u',note:'Also unique on <code>lower(email)</code>'},
    {n:'password_hash',t:'text',note:'Argon2id. NULL for Google-only accounts'},
    {n:'display_name',t:'text'},{n:'bio',t:'text'},
    {n:'avatar_url',t:'text',note:'Set by the worker when an avatar upload is ready'},
    {n:'role',t:'text',note:'user · moderator · admin'},
    {n:'status',t:'text',note:'active · suspended · deleted'},
    {n:'is_private',t:'boolean',note:'Followers need an accepted request'},
    {n:'follower_count',t:'integer',isNew:true,note:'Stored. Moved ±1 by the worker on <code>follow.changed</code>; repaired hourly'},
    {n:'following_count',t:'integer',isNew:true,note:'Stored, same as <code>follower_count</code>'},
    {n:'email_verified_at',t:'timestamptz'},
    {n:'totp_secret',t:'text',note:'AES-256-GCM encrypted by the API'},
    {n:'totp_enabled_at',t:'timestamptz',note:'Two-factor sign-in; required for staff routes'},
    {n:'created_at',t:'timestamptz'},{n:'updated_at',t:'timestamptz'},
    {n:'deleted_at',t:'timestamptz',note:'Starts the 30-day purge clock'}
  ],
  fks:[],
  notes:['Profiles read the stored counts instead of running <code>COUNT(*)</code> on <code>follows</code>.',
         '"People to follow" reads <code>users_suggest_idx</code> in order, instead of counting every user\'s followers and sorting.']
},
{
  name:'sessions', domain:'auth', purpose:'One row per signed-in device, with a sliding 30-day expiry.',
  badges:['public_id'],
  columns:[
    {n:'id',t:'bigint',k:'pk'},
    {n:'public_id',t:'uuid',k:'u',note:'The <code>sid</code> claim in access tokens'},
    {n:'user_id',t:'bigint',k:'fk'},
    {n:'refresh_token_hash',t:'text',k:'u',note:'SHA-256 of the secret; replaced on every refresh'},
    {n:'platform',t:'text',note:'android · ios · web'},
    {n:'app_version',t:'text'},{n:'push_token',t:'text',note:'FCM token for this device'},
    {n:'created_at',t:'timestamptz'},{n:'last_used_at',t:'timestamptz'},
    {n:'expires_at',t:'timestamptz'},{n:'revoked_at',t:'timestamptz'}
  ],
  fks:[{c:'user_id',to:'users',d:'cascade'}],
  notes:['Only the token hash is stored, so a leaked row cannot be replayed.']
},
{
  name:'auth_identities', domain:'auth', purpose:'Links an account to Google or Apple sign-in.',
  badges:['composite PK'],
  columns:[
    {n:'provider',t:'text',k:'pk',note:'google · apple'},
    {n:'provider_subject',t:'text',k:'pk',note:'The provider\'s stable user id'},
    {n:'user_id',t:'bigint',k:'fk'},
    {n:'created_at',t:'timestamptz'}
  ],
  fks:[{c:'user_id',to:'users',d:'cascade'}],
  notes:[]
},
{
  name:'auth_tokens', domain:'auth', purpose:'One-time codes emailed for verification and password reset.',
  columns:[
    {n:'id',t:'bigint',k:'pk'},{n:'user_id',t:'bigint',k:'fk'},
    {n:'purpose',t:'text',note:'verify_email (24 h) · reset_password (1 h)'},
    {n:'token_hash',t:'text',k:'u',note:'The plain code exists only in the email'},
    {n:'expires_at',t:'timestamptz'},{n:'used_at',t:'timestamptz'},{n:'created_at',t:'timestamptz'}
  ],
  fks:[{c:'user_id',to:'users',d:'cascade'}],
  notes:['Deleted 7 days after expiry or use.']
},
/* ---------- social ---------- */
{
  name:'follows', domain:'social', purpose:'The follow graph: one row per pair, toggled by status.',
  badges:['composite PK','toggle row'],
  columns:[
    {n:'follower_id',t:'bigint',k:'pk+fk'},
    {n:'following_id',t:'bigint',k:'pk+fk'},
    {n:'status',t:'text',note:'accepted · pending · <strong>inactive</strong> (new: unfollowed, withdrawn or declined)'},
    {n:'created_at',t:'timestamptz',note:'First follow ever'},
    {n:'updated_at',t:'timestamptz',isNew:true,note:'When the current status began; requests are listed by it'}
  ],
  fks:[{c:'follower_id',to:'users',d:'cascade'},{c:'following_id',to:'users',d:'cascade'}],
  checks:['<code>follower_id &lt;&gt; following_id</code>: no following yourself'],
  notes:['Unfollow, withdraw, decline and block set <code>inactive</code> instead of deleting. Following again reactivates the row, and <strong>only the first follow ever notifies</strong>.',
         'Every privacy check already tests <code>status = \'accepted\'</code>, so <code>inactive</code> needs no extra filter there.']
},
{
  name:'blocks', domain:'social', purpose:'A block, applied both ways by every visibility check.',
  badges:['composite PK'],
  columns:[
    {n:'blocker_id',t:'bigint',k:'pk+fk'},{n:'blocked_id',t:'bigint',k:'pk+fk'},{n:'created_at',t:'timestamptz'}
  ],
  fks:[{c:'blocker_id',to:'users',d:'cascade'},{c:'blocked_id',to:'users',d:'cascade'}],
  checks:['<code>blocker_id &lt;&gt; blocked_id</code>: no blocking yourself'],
  notes:['Blocking ends follows in both directions (sets them <code>inactive</code>).']
},
{
  name:'reports', domain:'social', purpose:'The moderation queue: what was reported, by whom, and the outcome.',
  badges:['polymorphic target'],
  columns:[
    {n:'id',t:'bigint',k:'pk'},{n:'reporter_id',t:'bigint',k:'fk'},
    {n:'target_type',t:'text',note:'user · post · comment · trail (005)'},
    {n:'target_id',t:'bigint',note:'<strong>No FK</strong>, on purpose: the report outlives its target'},
    {n:'reason',t:'text',note:'spam · harassment · nudity · violence · misinformation · other'},
    {n:'details',t:'text'},
    {n:'status',t:'text',note:'open · actioned · dismissed'},
    {n:'reviewed_by',t:'bigint',k:'fk'},{n:'reviewed_at',t:'timestamptz'},{n:'created_at',t:'timestamptz'}
  ],
  fks:[{c:'reporter_id',to:'users',d:'setnull'},{c:'reviewed_by',to:'users',d:'setnull'}],
  notes:[]
},
/* ---------- feed ---------- */
{
  name:'posts', domain:'feed', purpose:'A text post, an image post or a reel. Visible once its media is ready.',
  badges:['public_id','soft delete','stored counts','tsvector'],
  columns:[
    {n:'id',t:'bigint',k:'pk'},{n:'public_id',t:'uuid',k:'u'},
    {n:'user_id',t:'bigint',k:'fk'},
    {n:'type',t:'text',note:'text · image · reel'},
    {n:'caption',t:'text',note:'Required for text posts; full-text indexed'},
    {n:'media_id',t:'bigint',k:'fk',note:'Required unless <code>type = \'text\'</code>'},
    {n:'topic_id',t:'bigint',k:'fk',isNew:true,note:'Concept tag, so a reel can be a Learn before reading link (005)'},
    {n:'status',t:'text',note:'processing · published · removed (by a moderator)'},
    {n:'like_count',t:'integer',note:'Stored. Moved ±1 per like event by the worker (was: full recount)'},
    {n:'comment_count',t:'integer',note:'Stored, same as <code>like_count</code>'},
    {n:'created_at',t:'timestamptz'},{n:'updated_at',t:'timestamptz'},
    {n:'deleted_at',t:'timestamptz',note:'Hidden at once; purged after 30 days'}
  ],
  fks:[{c:'user_id',to:'users',d:'cascade'},{c:'media_id',to:'media_assets',d:'restrict'},{c:'topic_id',to:'topics',d:'setnull'}],
  checks:['<code>type = \'text\' OR media_id IS NOT NULL</code>'],
  notes:['Feeds are keyset-paginated on <code>(created_at, id)</code>, which the two partial indexes cover.']
},
{
  name:'post_likes', domain:'feed', purpose:'One row per user and post, toggled on and off with is_active.',

const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const tlink = (n) => `<a class="t" href="#table/${n}">${n}</a>`;
const chips = (names) => `<div class="chips">${names.map((n) => `<a class="chip" href="#table/${n}">${n}</a>`).join('')}</div>`;
const flow = (steps) => `<div class="flow">${steps.map((s) => `<b>${s}</b>`).join('<i aria-hidden="true">→</i>')}</div>`;
const crumbs = (parts) =>
  `<nav class="crumbs" aria-label="Breadcrumb">${parts
    .map(([label, href]) => (href ? `<a href="${href}">${label}</a>` : `<span>${label}</span>`))
    .join('<span aria-hidden="true">›</span>')}</nav>`;

const RULE_NAME = { cascade: 'Deleted too', setnull: 'Kept, link cleared', restrict: 'Delete refused' };
const counts = { cascade: 0, setnull: 0, restrict: 0 };
EDGES.forEach((e) => counts[e.d]++);

/** "This table points to X": what happens to this row when the row it points to is deleted. */
function outSentence(e) {
  const then = {
    cascade: 'this row is deleted with it',
    setnull: `this row stays and <code>${e.col}</code> is cleared`,
    restrict: 'the delete is refused while this row exists',
  }[e.d];
  return `Each row points to one ${tlink(e.to)} row through <code>${e.col}</code>.<small>If that ${e.to} row is deleted, ${then}.</small>`;
}
/** "X points to this table": what happens to X's rows when a row here is deleted. */
function inSentence(e) {
  const then = {
    cascade: `its ${e.from} rows are deleted too`,
    setnull: `its ${e.from} rows stay, with <code>${e.col}</code> cleared`,
    restrict: `it can't be deleted while ${e.from} rows use it`,
  }[e.d];
  return `${tlink(e.from)} points here through <code>${e.col}</code>.<small>If a row here is deleted, ${then}.</small>`;
}
const legend = () =>
  `<div class="legend"><span style="--c:var(--cascade)">Deleted too</span><span style="--c:var(--setnull)">Kept, link cleared</span><span style="--c:var(--restrict)">Delete refused</span></div>`;

/** Plain meanings for the tags on tables, shown under "Good to know". */
const BADGE_HELP = {
  public_id: 'Rows have a random <code>public_id</code> that the app uses; the internal <code>id</code> never leaves the server.',
  'soft delete': 'Deleting hides a row at once (<code>deleted_at</code>); it is removed for good after 30 days.',
  'stored counts': 'Counts are stored on the row and moved by the worker, instead of counted on every view.',
  'composite PK': 'The key is a pair of columns, so the same pair can only appear once.',
  'toggle row': 'One row per pair for ever: it is switched on and off instead of deleted and re-added, so nothing is notified twice.',
  'polymorphic target': 'It points at different kinds of rows through a plain id, with no foreign key.',
  'no FK': 'It keeps a plain id with no foreign key, so it outlives what it points at.',
  tsvector: 'Its text is indexed for full-text search.',
  'self-reference': 'Rows can point to other rows of the same table (replies).',
  'work queue': 'The worker picks up rows from it as jobs.',
  publishing: 'Team content: it starts as a draft and the app shows it only once it is published.',
  'deferrable PK': 'Its position is part of the key and is checked at the end of a transaction, so a whole list can be reordered at once.',
  ordered: 'Rows are kept in an order (<code>position</code>).',
  upsert: 'Each change rewrites the same row instead of adding one.',
  slug: 'It has a readable <code>slug</code> used in URLs.',
  pg_trgm: 'Its name is indexed for typo-tolerant search.',
  ingested: 'Some columns are filled by the worker from outside sources, never by the app.',
  'per language': 'There is one row per language (<code>en</code> or <code>bn</code>).',
  'typed link': 'Each row can link to one kind of content: a lesson or note, a quiz, or a reel.',
  'user content': 'Made by users, so it follows their privacy and can be reported.',
};

function viewTour(stepParam) {
  const i = Math.min(Math.max((parseInt(stepParam, 10) || 1) - 1, 0), TOUR.length - 1);
  const step = TOUR[i];
  const cells = TOUR.map(
    (s, k) => `<a href="#tour/${k + 1}" class="${k < i ? 'done' : k === i ? 'now' : ''}" aria-label="Step ${k + 1}: ${esc(s.title)}"${k === i ? ' aria-current="step"' : ''}></a>`,
  ).join('');
  return `<section class="tour">
    <div class="row-progress" style="--n:${TOUR.length}">${cells}</div>
    <p class="step-count">Step ${i + 1} of ${TOUR.length}</p>
    <h1>${step.title}</h1>
    ${step.text.map((p) => `<p class="lede">${p}</p>`).join('')}
    ${step.visual ? `<div class="visual">${step.visual()}</div>` : ''}
    ${step.tables ? `<div class="visual"><p class="hint">Tables in this step</p>${chips(step.tables)}</div>` : ''}
    <div class="tour-nav">
      <a class="btn" href="#tour/${i}" ${i === 0 ? 'aria-disabled="true" tabindex="-1"' : ''}>Back</a>
      ${i < TOUR.length - 1 ? `<a class="btn primary" href="#tour/${i + 2}">Next</a>` : `<a class="btn primary" href="#explore">Explore the tables</a>`}
    </div>
  </section>`;
}

function viewHome() {

    <h1>The Doshomik database, one step at a time</h1>
    <p class="lede">${TABLES.length} tables hold everything the app stores. If this is new to you, start with the tour.</p>
    <div class="paths">

      <a class="path" href="#ref"><b>Look something up</b><span>Delete rules, indexes, migrations and known gaps</span></a>
    </div>

function viewExplore() {
  return `<section>
    <h1>Explore the tables</h1>
    <p class="lede">The tables are grouped into ${DOMAINS.length} areas. Open one to see what it holds.</p>
    <label class="hint" for="find">Or find a table or column by name</label>
    <input id="find" class="search" type="search" placeholder="For example: user_id, papers, note" autocomplete="off" spellcheck="false">
    <div id="results">${areaList()}</div>
  </section>`;
}

function areaList() {
  return `<ul class="list">${DOMAINS.map(
    (d) => `<li><a class="item" href="#explore/${d.id}"><b>${d.name}</b><span>${d.desc}</span><small>${count(tablesIn(d.id).length, 'table', 'tables')}</small></a></li>`,
  ).join('')}</ul>`;
}

function searchResults(q) {
  const hits = TABLES.map((t) => ({ t, cols: t.columns.filter((c) => c.n.includes(q)).map((c) => c.n) })).filter(
    ({ t, cols }) => t.name.includes(q) || cols.length,
  );
  if (!hits.length) return `<p class="empty">No table or column contains “${esc(q)}”. Try part of a name, such as <code>user</code>.</p>`;
  return `<ul class="list">${hits
    .map(
      ({ t, cols }) =>
        `<li><a class="item" href="#table/${t.name}"><b class="t">${t.name}</b><span>${t.purpose}</span>${
          cols.length ? `<small>Columns: ${cols.slice(0, 5).join(', ')}${cols.length > 5 ? ` and ${cols.length - 5} more` : ''}</small>` : ''
        }</a></li>`,
    )
    .join('')}</ul>`;
}

function viewArea(id) {
  const d = domainById[id];
  if (!d) return viewNotFound();
  const list = tablesIn(id);
  return `<section>
    ${crumbs([['Explore', '#explore'], [d.name]])}
    <h1>${d.name}</h1>
    <p class="lede">${d.desc}</p>
    <ul class="list block">${list
      .map(
        (t) =>
          `<li><a class="item" href="#table/${t.name}"><b class="t">${t.name}</b><span>${t.purpose}</span><small>${count(t.columns.length, 'column', 'columns')}${
            t.isNewTable ? ', added in migration 005' : ''
          }</small></a></li>`,
      )
      .join('')}</ul>
  </section>`;
}

const TABS = [
  ['about', 'About'],
  ['columns', 'Columns'],
  ['links', 'Links'],
  ['indexes', 'Indexes'],
];

function viewTable(name, tab = 'about') {
  const t = byName[name];
  if (!t) return viewNotFound();
  if (!TABS.some(([key]) => key === tab)) tab = 'about';
  const d = domainById[t.domain];
  const idx = INDEXES.filter((i) => i.t.includes(t.name));
  const linkCount = outOf(name).length + into(name).length;
  const label = { about: 'About', columns: `Columns (${t.columns.length})`, links: `Links (${linkCount})`, indexes: `Indexes (${idx.length})` };
  const panel = { about: panelAbout, columns: panelColumns, links: panelLinks, indexes: panelIndexes }[tab](t, idx);
  const nextTab = TABS[TABS.findIndex(([key]) => key === tab) + 1];
  return `<section>
    ${crumbs([['Explore', '#explore'], [d.name, `#explore/${d.id}`], [t.name]])}
    <h1 class="table-title">${t.name}</h1>
    <p class="lede">${t.purpose}</p>
    <nav class="tabs" aria-label="About this table">${TABS.map(
      ([key]) => `<a href="#table/${name}/${key}"${key === tab ? ' aria-current="page"' : ''}>${label[key]}</a>`,
    ).join('')}</nav>
    ${panel}
    ${nextTab ? `<p class="next"><a href="#table/${name}/${nextTab[0]}">Next: ${label[nextTab[0]]}</a></p>` : `<p class="next"><a href="#explore/${d.id}">Back to ${d.name}</a></p>`}
  </section>`;
}

function panelAbout(t) {
  const out = new Set(outOf(t.name).map((e) => e.to));
  const inc = new Set(into(t.name).map((e) => e.from));
  const facts = [
    `In <a href="#explore/${t.domain}">${domainById[t.domain].name}</a>`,
    `<b>${t.columns.length}</b> columns`,
    `Points to <b>${out.size}</b> ${out.size === 1 ? 'table' : 'tables'}`,
    `<b>${inc.size}</b> ${inc.size === 1 ? 'table points' : 'tables point'} to it`,
  ];
  const know = [
    ...(t.isNewTable ? ['Added in migration 005 (Research tab).'] : []),
    ...(t.badges || []).filter((b) => BADGE_HELP[b]).map((b) => BADGE_HELP[b]),
    ...(t.checks || []).map((c) => `The database checks: ${c}`),
    ...(t.notes || []),
  ];
  return `<ul class="facts">${facts.map((f) => `<li>${f}</li>`).join('')}</ul>
    ${know.length ? `<h2>Good to know</h2><ul class="know">${know.map((k) => `<li>${k}</li>`).join('')}</ul>` : ''}`;
}

function keyPills(c, t) {
  const pills = [];
  const k = c.k || '';
  if (k.includes('pk')) pills.push('<span class="pill key">primary key</span>');
  if (k.includes('u')) pills.push('<span class="pill">unique</span>');
  const fk = (t.fks || []).find((f) => f.c === c.n);
  if (fk) pills.push(`<span class="pill">links to ${fk.to}</span>`);
  if (c.isNew) pills.push('<span class="pill new">new</span>');
  return pills.join('');
}

function panelColumns(t) {
  return `<ul class="cols">${t.columns
    .map(
      (c) =>
        `<li><div class="col-head"><span class="t">${c.n}</span><span class="type">${esc(c.t || '')}</span>${keyPills(c, t)}</div>${c.note ? `<p>${c.note}</p>` : ''}</li>`,
    )
    .join('')}</ul>`;
}

function panelLinks(t) {
  const out = outOf(t.name).filter((e) => e.to !== t.name);
  const self = outOf(t.name).filter((e) => e.to === t.name);
  const inc = into(t.name).filter((e) => e.from !== t.name);
  const outHtml = out.length
    ? `<ul class="links">${out.map((e) => `<li class="${e.d}">${outSentence(e)}</li>`).join('')}</ul>`
    : `<p class="empty">This table doesn’t point to any other table.</p>`;
  let inHtml = `<p class="empty">No other table points here.</p>`;
  if (inc.length && inc.length <= 6) {
    inHtml = `<ul class="links">${inc.map((e) => `<li class="${e.d}">${inSentence(e)}</li>`).join('')}</ul>`;
  } else if (inc.length) {
    // Many links (users has 37): one folded group per area, so the page stays short.
    inHtml = DOMAINS.map((d) => {
      const rows = inc.filter((e) => byName[e.from].domain === d.id);
      if (!rows.length) return '';
      return `<details><summary>${d.name}<small>${count(rows.length, 'link', 'links')}</small></summary><div class="inner"><ul class="links">${rows
        .map((e) => `<li class="${e.d}">${inSentence(e)}</li>`)
        .join('')}</ul></div></details>`;
    }).join('');
  }
  return `${legend()}
    <h2>This table points to</h2><div class="block" style="margin-top:12px">${outHtml}</div>
    ${self.length ? `<p class="hint">It also points to itself through <code>${self.map((e) => e.col).join(', ')}</code> (replies to comments).</p>` : ''}
    <h2 class="block">Tables that point here</h2><div style="margin-top:12px">${inHtml}</div>`;
}

function panelIndexes(t, idx) {
  if (!idx.length) return `<p class="empty">Only its primary key and unique columns are indexed. That is enough for how it is read.</p>`;
  return `<ul class="cols">${idx
    .map((i) => `<li><div class="col-head"><b>${i.purpose}</b>${i.isNew ? '<span class="pill new">new</span>' : ''}</div><p><code>${esc(i.idx)}</code></p></li>`)
    .join('')}</ul>`;
}

/* ============================================================
   Reference: one topic per page
   ============================================================ */
const REF = [
  ['conventions', 'Conventions', 'The patterns almost every table follows'],
  ['links', 'All links between tables', `Every foreign key (${EDGES.length}) and what deleting does`],
  ['indexes', 'Indexes', 'What is indexed, and for which screen'],
  ['rules', 'Rules the database enforces', 'Checks on values, and the errors the API returns'],
  ['lifecycle', 'How data changes and expires', 'Status flows, and what is cleaned up when'],
  ['research', 'Research tab features', 'Each feature of the spec and the tables behind it (migration 005)'],
  ['efficiency', 'Efficiency changes', 'Toggle rows and stored counts (migration 004)'],
  ['migrations', 'Migrations', 'The six SQL files, in order'],
  ['gaps', 'Known gaps', 'What is planned, and when'],
];

function viewRef(topic) {
  if (!topic) {
    return `<section>
      <h1>Reference</h1>
      <p class="lede">Detailed lists, one topic per page.</p>
      <ul class="list block">${REF.map(([id, title, desc]) => `<li><a class="item" href="#ref/${id}"><b>${title}</b><span>${desc}</span></a></li>`).join('')}</ul>
    </section>`;
  }
  const entry = REF.find(([id]) => id === topic);
  if (!entry) return viewNotFound();
  const body = REF_PAGES[topic]();
  return `<section>${crumbs([['Reference', '#ref'], [entry[1]]])}<h1>${entry[1]}</h1><p class="lede">${entry[2]}.</p><div class="block">${body}</div></section>`;
}

const fold = (summary, inner, small = '') => `<details><summary>${summary}${small ? `<small>${small}</small>` : ''}</summary><div class="inner">${inner}</div></details>`;

const REF_PAGES = {
  conventions: () => CONVENTIONS.map(([term, text]) => fold(term, `<p>${text}</p>`)).join(''),

  links: () => `${legend()}
    <div class="filters" role="group" aria-label="Filter by what deleting does">
      <button type="button" data-rule="all" aria-pressed="true">All</button>
      <button type="button" data-rule="cascade" aria-pressed="false">Deleted too (${counts.cascade})</button>
      <button type="button" data-rule="setnull" aria-pressed="false">Kept, link cleared (${counts.setnull})</button>
      <button type="button" data-rule="restrict" aria-pressed="false">Delete refused (${counts.restrict})</button>
    </div>
    <p class="hint">Grouped by the table being pointed at. Open a group to see its links.</p>
    <div id="link-groups">${linkGroups('all')}</div>`,

  indexes: () => INDEXES.map((i) => fold(i.purpose, `<p><code>${esc(i.idx)}</code></p>${chips(i.t)}`, i.isNew ? 'new' : '')).join(''),

  rules: () => `<h2>Checks on values</h2><div class="block" style="margin-top:12px">${CHECKS.map(([table, rule, text]) =>
    fold(rule, `<p>${text}</p><p class="hint">On ${tlink(table)}</p>`),
  ).join('')}</div>
    <h2 class="block">Errors the API returns</h2>
    <div class="demo block" style="margin-top:12px"><table><thead><tr><th>When the database refuses</th><th>The API answers</th></tr></thead><tbody>${ERRORS.map(
      ([a, b]) => `<tr><td style="font-family:var(--font)">${a}</td><td>${b}</td></tr>`,
    ).join('')}</tbody></table></div>`,

  lifecycle: () => `<h2>Status flows</h2><div class="block" style="margin-top:12px">${FLOWS.map((f) =>
    fold(f.title, `${flow(f.alt ? [...f.steps, `or ${f.alt}`] : f.steps)}<p style="margin-top:12px">${f.note}</p>`),
  ).join('')}</div>
    <h2 class="block">What is cleaned up, and when</h2><div class="block" style="margin-top:12px">${RETENTION.map(([what, rule]) => fold(what, `<p>${rule}</p>`)).join('')}</div>`,

  research: () => `<p>Group A of the Research spec, feature by feature. Open one to see what existed and what was added.</p>
    ${RESEARCH.map(([id, feature, had, added, tables]) =>
      fold(`${id}: ${feature}`, `<p><b>Already there:</b> ${had}</p><p><b>Added:</b> ${added}</p>${chips(tables)}`),
    ).join('')}
    <h2 class="block">How the data flows</h2><div class="block" style="margin-top:12px">${RESEARCH_FLOWS.map((f) =>
      fold(f.title, `${flow(f.steps)}<p style="margin-top:12px">${f.note}</p>`),
    ).join('')}</div>
    <h2 class="block">Decisions worth knowing</h2><div class="block" style="margin-top:12px">${RESEARCH_DECISIONS.map(([a, b]) => fold(a, `<p>${b}</p>`)).join('')}</div>`,

  efficiency: () => `${CHANGES.map((c) =>
    fold(c.title, `<div class="ba"><div class="before"><b>Before.</b> ${c.before}</div><div class="after"><b>After.</b> ${c.after}</div></div><p class="hint" style="margin-top:10px">Where: ${c.where}</p>${chips([c.tag])}`),
  ).join('')}
    <h2 class="block">Looked at and left as they are</h2><div class="block" style="margin-top:12px">${KEPT.map(([what, why]) => fold(what, `<p>${why}</p>`)).join('')}</div>`,

  migrations: () => MIGRATIONS.map(([file, text], i) => fold(`${i + 1}. ${file.replace(/<[^>]+>.*$/, '').trim()}`, `<p>${text}</p>`)).join('') +
    `<p class="hint block">Never edit a migration that has been applied: add a new one. After a schema change, regenerate <code>src/db/types.ts</code> with <code>pnpm db:types</code>.</p>`,

  gaps: () => GAPS.map(([gap, plan, when]) => fold(gap, `<p>${plan}</p>`, when)).join(''),
};

function linkGroups(rule) {
  const rows = EDGES.filter((e) => rule === 'all' || e.d === rule);
  const targets = [...new Set(rows.map((e) => e.to))].sort((a, b) => into(b).length - into(a).length || a.localeCompare(b));
  if (!targets.length) return `<p class="empty">No links of this kind.</p>`;
  return targets
    .map((to) => {
      const group = rows.filter((e) => e.to === to);
      return fold(`<span class="t">${to}</span>`, `<ul class="links">${group.map((e) => `<li class="${e.d}">${inSentence(e)}</li>`).join('')}</ul>`, count(group.length, 'link', 'links'));
    })
    .join('');
}

function viewNotFound() {
  return `<section><h1>Nothing here</h1><p class="lede">This page doesn’t exist. Go back to <a href="#home">Home</a> or <a href="#explore">Explore</a>.</p></section>`;
}

/* ============================================================
   Routing: #home, #tour/3, #explore, #explore/research,
   #table/papers/links, #ref, #ref/indexes
   ============================================================ */
// Older links (the previous explorer, and links inside the data) still land somewhere useful.
const ALIASES = { overview: 'home', map: 'ref/links', tables: 'explore', indexes: 'ref/indexes', rules: 'ref/rules', lifecycle: 'ref/lifecycle', research: 'ref/research', changes: 'ref/efficiency', migrations: 'ref/migrations', roadmap: 'ref/gaps' };

function route() {
  let hash = location.hash.replace(/^#/, '') || 'home';
  if (ALIASES[hash]) {
    history.replaceState(null, '', `#${ALIASES[hash]}`);
    hash = ALIASES[hash];
  }
  const [view, a, b] = hash.split('/');
  const html =
    view === 'home' ? viewHome()
    : view === 'tour' ? viewTour(a)
    : view === 'explore' ? (a ? viewArea(a) : viewExplore())
    : view === 'table' ? viewTable(a, b)
    : view === 'ref' ? viewRef(a)
    : viewNotFound();
  app.innerHTML = html;

  const section = { home: 'home', tour: 'tour', explore: 'explore', table: 'explore', ref: 'ref' }[view];
  document.querySelectorAll('[data-nav]').forEach((link) => {
    if (link.dataset.nav === section) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  document.title = `Doshomik schema guide: ${app.querySelector('h1')?.textContent || 'Home'}`;
  window.scrollTo(0, 0);
  wire();
}

/** Behaviour for the few interactive parts of the current view. */
function wire() {
  const find = document.getElementById('find');
  if (find) {
    find.addEventListener('input', () => {
      const q = find.value.trim().toLowerCase();
      document.getElementById('results').innerHTML = q ? searchResults(q) : areaList();
    });
  }
  document.querySelectorAll('[data-rule]').forEach((button) =>
    button.addEventListener('click', () => {
      document.querySelectorAll('[data-rule]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      document.getElementById('link-groups').innerHTML = linkGroups(button.dataset.rule);
    }),
  );
}

// Arrow keys move through the tour.
document.addEventListener('keydown', (event) => {
  if (!location.hash.startsWith('#tour') || event.target.closest('input')) return;
  const current = parseInt(location.hash.split('/')[1], 10) || 1;
  if (event.key === 'ArrowRight' && current < TOUR.length) location.hash = `#tour/${current + 1}`;
  if (event.key === 'ArrowLeft' && current > 1) location.hash = `#tour/${current - 1}`;
});
window.addEventListener('hashchange', route);
route();
</script>
