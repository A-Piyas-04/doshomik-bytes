<title>Athenyx report</title>
<style>
:root{
  --radius:4px;
  --background:#fcfbf8;--foreground:#21170a;--card:#ffffff;--muted:#f3f0e8;--muted-foreground:#6e624f;--subtle:#9a8f7c;
  --secondary:#f2efe6;--accent:#f6eebb;--accent-foreground:#4a3600;--border:#e7e2d6;--border-strong:#cfc7b5;--link:#806800;
  --primary:#e1c802;--primary-foreground:#241600;--ring:#a28900;
  --sev-critical:#a5160c;--sev-high:#dc4a1f;--sev-medium:#c28f00;--sev-low:#3f6aa6;--sev-info:#8f8778;
  --ok:#2f7d4f;--warn:#a87400;--bad:#b42318;
  --gold-500:#e1c802;--gold-700:#a28900;--gold-800:#806800;--umber-800:#614501;--umber-900:#412201;
  --font-display:"Bricolage Grotesque","Segoe UI Variable Display","SF Pro Display",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI Variable Text","SF Pro Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  color-scheme:light;
}
.dark{
  --background:#14100a;--foreground:#f2ede1;--card:#1c170f;--muted:#221c13;--muted-foreground:#a99d87;--subtle:#7a6f5c;
  --secondary:#261f14;--accent:#2e2711;--accent-foreground:#f0dc5a;--border:#2f2719;--border-strong:#463a26;--link:#e1c802;
  --primary:#e1c802;--primary-foreground:#1a1203;--ring:#e1c802;
  --sev-critical:#ff6a55;--sev-high:#ff9257;--sev-medium:#e1c802;--sev-low:#85a8de;--sev-info:#8c8371;
  --ok:#6bc68f;--warn:#e8b931;--bad:#ff6a55;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--foreground)}
body{font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--font-mono);font-size:.86em;font-feature-settings:"liga" 0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid var(--border);background:var(--background);position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--font-display);letter-spacing:-.01em}
.brand .proj{font-weight:500;color:var(--muted-foreground);font-family:var(--font-body);font-size:14px}
.fresh{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted-foreground);padding:0 0 10px}
.fresh b{color:var(--foreground);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:baseline;gap:7px;padding:10px 12px 11px;color:var(--muted-foreground);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a .n{font:500 11px var(--font-mono);color:var(--subtle)}
.tabs a:hover{color:var(--foreground);text-decoration:none}
.tabs a.on{color:var(--foreground);border-bottom-color:var(--primary)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer}
.icon-btn:hover{border-color:var(--border-strong)}
main{padding:36px 0 80px}
.eyebrow{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;margin:0}
h1{font-size:30px;line-height:1.15;font-weight:700}
h2{font-size:20px;font-weight:700;margin-bottom:14px}
h3{font-size:16px;font-weight:650}
.lead{color:var(--muted-foreground);max-width:70ch;margin:8px 0 0}
.page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px}
section.block{margin-top:40px}
.muted{color:var(--muted-foreground)}.subtle{color:var(--subtle)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px}
.hair{border-top:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:3px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--secondary);white-space:nowrap}
.chip.sev{color:#fff;border:0}
.sev-CRITICAL{background:var(--sev-critical)}.sev-HIGH{background:var(--sev-high)}.sev-MEDIUM{background:var(--sev-medium);color:#241600!important}.sev-LOW{background:var(--sev-low)}.sev-INFO{background:var(--sev-info)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.t-serious{color:var(--bad)}.t-concerns{color:var(--warn)}.t-clear{color:var(--ok)}.t-absent{color:var(--subtle)}
.st-OPEN{color:var(--bad)}.st-IN_PROGRESS{color:var(--warn)}.st-RESOLVED{color:var(--ok)}.st-ACCEPTED_RISK{color:var(--link)}.st-DISMISSED{color:var(--subtle)}
.mark{display:inline-grid;place-items:center;border-radius:4px;border:1px solid var(--foreground);background:var(--foreground);color:var(--background);flex:none}
.mark.idle{background:var(--card);color:var(--foreground);border-color:var(--border-strong)}
.mark.dim{background:transparent;color:var(--subtle);border-color:var(--border)}
.mark.gold{background:var(--gold-500);color:var(--umber-900);border-color:var(--umber-800)}
.stat{padding:14px 16px;border:1px solid var(--border);border-radius:6px;background:var(--card);min-width:0}
.stat .v{font:700 26px var(--font-display);letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--muted-foreground)}
a.stat:hover{border-color:var(--border-strong);text-decoration:none}
.board-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);text-align:left;cursor:pointer;min-width:0}
.seat:hover{border-color:var(--border-strong)}
.seat.absent{background:transparent;cursor:default}
.seat.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.seat .nm{font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-size:11.5px}
.flow{display:grid;grid-template-columns:1.1fr auto .9fr auto 1.1fr;gap:12px;align-items:stretch}
.flow .arrow{display:grid;place-items:center;color:var(--subtle)}
.tally{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:13px}
.tally .num{font:600 13px var(--font-mono);text-align:right}
.finding{border:1px solid var(--border);border-radius:6px;background:var(--card);margin-bottom:10px}
.finding>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.finding>summary::-webkit-details-marker{display:none}
.finding[open]>summary{border-bottom:1px solid var(--border)}
.finding .body{padding:16px}
.ftitle{font-weight:650;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted-foreground);margin-top:4px}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted-foreground);font-size:13px}
dl.kv dd{margin:0}
.code{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:10px 0;background:var(--muted)}
.code .hd{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;background:var(--card)}
.code pre{margin:0;padding:10px 0;overflow-x:auto;font-size:12.5px;line-height:1.6}
.code .ln{display:flex}
.code .ln .no{width:48px;flex:none;text-align:right;padding-right:14px;color:var(--subtle);user-select:none}
.code .ln .tx{white-space:pre;padding-right:14px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.opt{border:1px solid var(--border);border-radius:6px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.opt.rec{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt ul{margin:0;padding-left:0;list-style:none;font-size:13.5px}
.opt li{display:flex;gap:6px;margin:3px 0}
.opt li .i{flex:none;margin-top:3px}
.pro .i{color:var(--ok)}.con .i{color:var(--bad)}
.effort{display:inline-flex;gap:3px;align-items:center}
.effort i{width:14px;height:6px;border-radius:2px;background:var(--border-strong)}
.effort i.on{background:var(--gold-700)}
.cmd{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:4px;background:var(--muted);padding:6px 8px 6px 10px;font:12.5px var(--font-mono);overflow:hidden}
.cmd span{flex:1;overflow-x:auto;white-space:nowrap}
.cmd button{border:1px solid var(--border);background:var(--card);border-radius:3px;cursor:pointer;display:inline-grid;place-items:center;width:26px;height:24px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-strong)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted-foreground)}
.seg button.on{background:var(--foreground);color:var(--background)}
input.search,select{height:32px;border:1px solid var(--border);border-radius:4px;background:var(--card);padding:0 10px;font:inherit;font-size:13px;color:var(--foreground)}
input.search{min-width:220px}
.toggle{border:1px solid var(--border);background:var(--card);border-radius:3px;padding:3px 8px;font-size:12px;cursor:pointer}
.toggle.on{border-color:var(--sev-high);background:var(--sev-high);color:#fff}
.notice{border:1px solid var(--border-strong);border-radius:6px;padding:12px 14px;background:var(--accent);color:var(--accent-foreground);font-size:14px;display:flex;gap:10px}
.empty{border:1px dashed var(--border-strong);border-radius:6px;padding:32px;text-align:center;color:var(--muted-foreground)}
.md p{margin:0 0 .8em}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.3em}
.md pre{background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:10px;overflow-x:auto}
.md code{background:var(--muted);padding:1px 4px;border-radius:3px}
.md pre code{background:none;padding:0}
.md h4{font:650 15px var(--font-display);margin:1em 0 .4em}
.timeline{list-style:none;margin:0;padding:0;border-left:1px solid var(--border-strong)}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--gold-700)}
.split{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.picker{border:1px solid var(--border);border-radius:6px;background:var(--card);overflow:hidden;position:sticky;top:150px;max-height:calc(100vh - 170px);overflow-y:auto}
.picker a{display:block;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--foreground);font-size:13.5px}
.picker a:hover{background:var(--muted);text-decoration:none}
.picker a.on{background:var(--accent)}
.verdict{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.verdict .big{font:800 34px var(--font-display);letter-spacing:-.03em}
.v-GO{color:var(--ok)}.v-CONDITIONAL_GO{color:var(--warn)}.v-NO_GO{color:var(--bad)}
footer{border-top:1px solid var(--border);padding:22px 0 40px;font-size:12.5px;color:var(--muted-foreground)}
@media (max-width:860px){.flow{grid-template-columns:1fr}.flow .arrow{transform:rotate(90deg)}.split{grid-template-columns:1fr}.picker{position:static;max-height:280px}dl.kv{grid-template-columns:1fr}}
@media print{header.top{position:static}.tabs,.icon-btn,.cmd button{display:none}}
</style>
</head>
