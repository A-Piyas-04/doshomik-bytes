<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doshomik backend guide</title>
<script>
  // The page opens light. A saved choice is applied before the first paint, so it doesn't flash.
  try { const saved = localStorage.getItem('api-guide-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same skin as docs/schema-guide.html: ink on paper, hairline structure, one cobalt accent. */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#15181C; --ink-2:#434A53; --muted:#737A83; --line:#E2E4E7; --line-2:#CDD1D6;
  --accent:#2547C4; --accent-ink:#FFFFFF; --accent-soft:#EEF1FB;
  --red:#B3402D; --red-soft:#FBEEEB; --amber:#8F6000; --amber-soft:#FAF3E2; --slate:#58626E; --slate-soft:#EFF1F3;
  --blue:#3F6B8C; --blue-soft:#E6EEF5; --green:#2C7A4B; --green-soft:#E5F2EA; --violet:#7A4A93; --violet-soft:#F2EAF6;
  --code-bg:rgba(21,24,28,.055);
  --a0:#2F6A9C; --a1:#8A4C9E; --a2:#B4532A; --a3:#7C6A1F; --a4:#2C8456; --a5:#A66414; --a6:#147A86; --a7:#5C6670;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#15181D; --ink:#E7E9EC; --ink-2:#B2B8C0; --muted:#7F868F; --line:#252A31; --line-2:#363C45;
    --accent:#8EA5FF; --accent-ink:#0F1114; --accent-soft:#1A2140;
    --red:#E8907E; --red-soft:#2C1C19; --amber:#DDB45C; --amber-soft:#2A2314; --slate:#A3ADB8; --slate-soft:#1D2229;
    --blue:#8DB6D4; --blue-soft:#1C2730; --green:#7CCB9C; --green-soft:#16261D; --violet:#C896DA; --violet-soft:#261C2C;
    --code-bg:rgba(231,233,236,.07);
    --a0:#7DB3E3; --a1:#C896DA; --a2:#E8977A; --a3:#CDB866; --a4:#7CCB9C; --a5:#E3A35E; --a6:#6CC6D1; --a7:#A6B0BA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#15181D; --ink:#E7E9EC; --ink-2:#B2B8C0; --muted:#7F868F; --line:#252A31; --line-2:#363C45;
  --accent:#8EA5FF; --accent-ink:#0F1114; --accent-soft:#1A2140;
  --red:#E8907E; --red-soft:#2C1C19; --amber:#DDB45C; --amber-soft:#2A2314; --slate:#A3ADB8; --slate-soft:#1D2229;
  --blue:#8DB6D4; --blue-soft:#1C2730; --green:#7CCB9C; --green-soft:#16261D; --violet:#C896DA; --violet-soft:#261C2C;
  --code-bg:rgba(231,233,236,.07);
  --a0:#7DB3E3; --a1:#C896DA; --a2:#E8977A; --a3:#CDB866; --a4:#7CCB9C; --a5:#E3A35E; --a6:#6CC6D1; --a7:#A6B0BA;
  color-scheme:dark;
}
/* methods and access tiers */
.m-GET{--c:var(--blue);--cs:var(--blue-soft)}
.m-POST{--c:var(--green);--cs:var(--green-soft)}
.m-PUT{--c:var(--amber);--cs:var(--amber-soft)}
.m-PATCH{--c:var(--violet);--cs:var(--violet-soft)}
.m-DELETE{--c:var(--red);--cs:var(--red-soft)}
.x-public{--c:var(--slate);--cs:var(--slate-soft)}
.x-token{--c:var(--blue);--cs:var(--blue-soft)}
.x-user{--c:var(--accent);--cs:var(--accent-soft)}
.x-moderator{--c:var(--amber);--cs:var(--amber-soft)}
.x-admin{--c:var(--red);--cs:var(--red-soft)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
::selection{background:var(--accent);color:var(--accent-ink)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h1{font-size:2.3rem;letter-spacing:-.025em;margin-bottom:12px}
h2{font-size:1.25rem;letter-spacing:-.015em}
h3{font-size:1.02rem;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:70ch}
code,.t{font-family:var(--mono);font-size:.86em}
code{background:var(--code-bg);border-radius:3px;padding:.08em .32em}
button{font:inherit;color:inherit}

/* ---- top bar ---- */
.bar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar-in{max-width:1120px;margin:0 auto;padding:0 24px;min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;justify-content:space-between}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand::before{content:"";width:14px;height:14px;border:2px solid var(--ink);border-radius:2px;box-shadow:3px 3px 0 var(--accent)}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
nav.main a{color:var(--muted);text-decoration:none;padding:18px 9px 16px;font-weight:500;font-size:.95rem;box-shadow:inset 0 -2px 0 transparent;transition:color .2s,box-shadow .2s}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
nav.main a.out{color:var(--ink-2)}
.theme-toggle{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line-2);border-radius:4px;padding:5px 9px;cursor:pointer;color:var(--ink-2);margin-left:8px}
.theme-toggle:hover{border-color:var(--ink);color:var(--ink)}
.theme-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{max-width:1120px;margin:0 auto;padding:44px 24px 90px}
main.narrow{max-width:800px}
.lede{font-size:1.1rem;color:var(--ink-2);max-width:72ch}
.hint{color:var(--muted);font-size:.92rem}
.crumbs{font-size:.88rem;color:var(--muted);margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted);text-decoration-color:var(--line-2)}
.block{margin-top:40px}
.block > h2{margin-bottom:14px}
.block > h2 small{font-weight:500;color:var(--muted);font-size:.9rem;margin-left:8px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 48px;color:var(--muted);font-size:.85rem}
footer::before{content:"";display:block;border-top:1px solid var(--line);margin-bottom:20px}

/* ---- small pieces ---- */
.meth{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.03em;color:var(--c);background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:3px;padding:1px 0;width:58px;text-align:center;flex:none}
.meth.big{font-size:1rem;width:auto;padding:4px 12px}
.path{font-family:var(--mono);font-size:.92rem;color:var(--ink);word-break:break-all}
.path .param{color:var(--accent);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;color:var(--c);background:var(--cs);border-radius:3px;padding:1px 8px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-2);white-space:nowrap}
.tag.w{border-color:var(--ink-2);color:var(--ink)}
.tag.ev{border-color:var(--accent);color:var(--accent)}
.tag.rl{border-color:var(--amber);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.82rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:3px 9px}
a.chip:hover{border-color:var(--ink)}
.chip i{font-style:normal;font-family:var(--font);font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted));flex:none}
.op{font-family:var(--font);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:0 5px;border-radius:2px}
.op.read{color:var(--muted);background:var(--slate-soft)}
.op.insert{color:var(--green);background:var(--green-soft)}
.op.update{color:var(--amber);background:var(--amber-soft)}
.op.delete{color:var(--red);background:var(--red-soft)}
.btn{display:inline-block;font-weight:600;padding:9px 18px;border-radius:4px;border:1px solid var(--line-2);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled="true"]{visibility:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin:26px 0 24px;border-bottom:1px solid var(--line)}
.tabs a{padding:9px 12px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabs a small{color:var(--muted);font-weight:500;margin-left:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 0;color:var(--ink-2);padding:0;list-style:none;margin:0 0 6px}
.facts li{padding-right:16px;margin-right:16px;border-right:1px solid var(--line)}
.facts li:last-child{border-right:0}
.facts b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);padding:14px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--muted);margin:0 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.legend span.line::before{height:3px;width:18px;vertical-align:3px}
.legend span.dash::before{height:0;width:18px;border-top:2px dashed var(--c);background:none;vertical-align:3px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.copy{font-size:.8rem;font-weight:600;padding:4px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--ink)}
.copy.done{color:var(--green);border-color:var(--green)}
pre.code{font-family:var(--mono);font-size:.84rem;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;overflow-x:auto;margin:0;color:var(--ink)}
.codehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 6px}
.codehead h3{font-size:.95rem}
.src{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-decoration:none}
.src:hover{color:var(--accent);text-decoration:underline}

/* ---- home ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:34px 0 10px}
.stat{border-top:3px solid var(--c,var(--ink));padding-top:12px}
.stat b{display:block;font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.stat span{display:block;margin-top:6px;color:var(--ink-2);font-size:.95rem;font-weight:500}
.stack{display:flex;height:34px;border-radius:4px;overflow:hidden;margin:12px 0 8px;border:1px solid var(--line)}
.stack a{display:flex;align-items:center;justify-content:center;background:var(--cs);color:var(--c);font-weight:700;font-size:.85rem;text-decoration:none;border-right:2px solid var(--bg);min-width:28px;transition:filter .2s}
.stack a:last-child{border-right:0}
.stack a:hover{filter:brightness(.95) saturate(1.3)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.door{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:4px;padding:18px 20px;transition:box-shadow .2s,border-color .2s}
.door b{display:block;font-size:1.2rem;letter-spacing:-.015em}
.door span{display:block;margin-top:6px;color:var(--ink-2);font-size:.95rem;line-height:1.5}
.door:hover{border-color:var(--line-2);box-shadow:0 10px 24px -18px rgba(0,0,0,.4)}
.door:hover b{color:var(--c,var(--accent))}
.start{counter-reset:s;list-style:none;padding:0;margin:0}
.start li{counter-increment:s;position:relative;padding:12px 0 12px 44px;border-bottom:1px solid var(--line)}
.start li::before{content:counter(s);position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}

/* ---- diagrams ---- */
.canvas{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background-color:var(--surface);background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:22px 22px;margin:16px 0 12px}
svg.dia{display:block;width:100%;height:auto}
svg.dia text{font-family:var(--font);fill:var(--ink)}
svg.dia .mono{font-family:var(--mono)}
svg.dia .sub{fill:var(--muted);font-size:11.5px}
svg.dia .hd{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
svg.dia .box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.3}
svg.dia .proc{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:none}
svg.dia .tier{fill:var(--bg);stroke:var(--line-2);stroke-width:1}
svg.dia .node{cursor:pointer;transition:opacity .15s}
svg.dia .node rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.3;transition:stroke .15s,stroke-width .15s}
svg.dia .node:hover rect,svg.dia .node:focus-visible rect{stroke:var(--ink);stroke-width:2.2}
svg.dia .node:focus{outline:none}
svg.dia .node text{font-size:13px;font-weight:600}
svg.dia .node text.mono{font-size:12px;font-weight:500}
svg.dia .node text.n{font-size:11px;font-weight:600;fill:var(--muted)}
svg.dia .edge{fill:none;stroke:var(--muted);stroke-width:1.4;transition:opacity .15s}
svg.dia .edge.async{stroke-dasharray:5 4}
svg.dia .edge.w{stroke-width:2}
svg.dia .edge.r{stroke-opacity:.45;stroke-width:1}
svg.dia .elabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg.dia.focusing .edge{opacity:.06}
svg.dia.focusing .edge.on{opacity:1}
svg.dia.focusing .node{opacity:.25}
svg.dia.focusing .node.on{opacity:1}
svg.dia .arrow{fill:var(--muted)}
.panel{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;background:var(--surface);padding:14px 18px;margin:12px 0}
.panel h3{margin-bottom:6px}
.panel .hint{margin:0 0 8px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin:10px 0}

/* ---- matrix ---- */
.matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:16px 0;max-height:78vh}
table.matrix{border-collapse:separate;border-spacing:0;font-size:.8rem}
table.matrix th,table.matrix td{padding:0}
table.matrix thead{position:sticky;top:0;z-index:3;background:var(--surface)}
table.matrix thead th{position:relative;vertical-align:bottom;height:168px;width:26px;min-width:26px;max-width:26px}
table.matrix thead th.area{height:26px;width:auto;max-width:none;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);border-bottom:3px solid var(--c);text-align:left}
table.matrix thead th.area span{position:absolute;left:4px;right:2px;top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.matrix thead th .rot{position:absolute;left:10px;bottom:8px;transform:rotate(-60deg);transform-origin:0 100%;white-space:nowrap;font-family:var(--mono);font-weight:500;color:var(--ink-2)}
table.matrix thead th a{color:inherit;text-decoration:none}
table.matrix thead th a:hover{color:var(--accent)}
table.matrix tbody th{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;font-weight:600;padding:0 14px 0 12px;white-space:nowrap;border-right:1px solid var(--line);font-size:.86rem}
table.matrix tbody th small{color:var(--muted);font-weight:500;margin-left:6px}
table.matrix td{width:26px;height:26px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.matrix td button{width:100%;height:100%;border:0;background:transparent;cursor:pointer;font-family:var(--mono);font-size:.72rem;font-weight:600;padding:0}
table.matrix td button.w{background:color-mix(in srgb,var(--c) calc(var(--k) * 1%),transparent);color:var(--ink)}
table.matrix td button.r{color:var(--muted);background:var(--slate-soft)}
table.matrix td button:hover{outline:2px solid var(--ink);outline-offset:-2px}
table.matrix td button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
table.matrix tr.group th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:10px;height:30px;background:var(--bg)}
table.matrix tr.group td{background:var(--bg);border-right:0}

/* ---- endpoint list ---- */
.toolbar{position:sticky;top:58px;z-index:10;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.search{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.filters .lab{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 10px}
.filters .lab:first-child{margin-left:0}
.fbtn{font-size:.82rem;font-weight:600;padding:4px 10px;border-radius:3px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);transition:all .15s}
.fbtn:hover{border-color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--bg)}
.count{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.mod{margin-top:30px}
.mod-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.mod-head h2{font-size:1.15rem}
.mod-head .hint{margin:0}
.mod-head .n{margin-left:auto;font-weight:600;color:var(--muted);font-size:.9rem}
.sec{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.eps{list-style:none;margin:0;padding:0}
.eps li{border-bottom:1px solid var(--line)}
.eps a{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:9px 10px;text-decoration:none;color:var(--ink);transition:background-color .15s,box-shadow .15s}
.eps a:hover{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.eps .desc{grid-column:2 / 4;font-size:.86rem;color:var(--ink-2);margin-top:-2px;line-height:1.45}
.eps .marks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* ---- endpoint page ---- */
.ep-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.ep-title .path{font-size:1.55rem;font-weight:500;letter-spacing:-.01em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:8px 0 6px}

<script type="application/json" id="guide">__GUIDE__</script>
<script>
'use strict';
const F = JSON.parse(document.getElementById('facts').textContent);
const G = JSON.parse(document.getElementById('guide').textContent);
const app = document.getElementById('app');

// ------------------------------------------------------------ helpers
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const uniq = (a) => [...new Set(a)];
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const srcHref = (file, line) => `../${file}${line ? `#L${line}` : ''}`;
const srcLink = (file, line, label) => `<a class="src" href="${srcHref(file, line)}" title="Open the source file">${esc(label ?? `${file.replace('apps/api/src/', '')}${line ? `:${line}` : ''}`)}</a>`;
const pathHtml = (url) => esc(url).replace(/(:[a-zA-Z_]+|\*)/g, '<span class="param">$1</span>');
const meth = (m, big) => `<span class="meth m-${m}${big ? ' big' : ''}">${m}</span>`;
const OPS = ['read', 'insert', 'update', 'delete'];
const isWrite = (ops) => ops.some((o) => o !== 'read');

const MODS = new Map(G.modules.map((m) => [m.id, m]));
const ACCESS = new Map(G.access.map((a) => [a.id, a]));
const GROUPS = new Map(G.groups.map((g) => [g.id, g]));
const accessBadge = (a) => `<span class="badge x-${a}">${esc(ACCESS.get(a)?.name ?? a)}</span>`;

// Tables → schema-guide area (colour index) and links.
const AREA_OF = new Map();
F.areas.forEach((a, i) => a.tables.forEach((t) => AREA_OF.set(t, { ...a, i })));
const areaColor = (t) => `var(--a${AREA_OF.has(t) ? AREA_OF.get(t).i % 8 : 7})`;
const tableHref = (t) => `schema-guide.html#table/${t}`;
const tableChip = (t, ops) => `<a class="chip dot" style="--c:${areaColor(t)}" href="${tableHref(t)}" title="Open ${t} in the schema guide">${esc(t)}${ops ? ' ' + ops.map((o) => `<span class="op ${o}">${o === 'read' ? 'R' : o[0].toUpperCase()}</span>`).join('') : ''}</a>`;
const opsHtml = (ops) => OPS.filter((o) => ops.includes(o)).map((o) => `<span class="op ${o}">${o}</span>`).join('');

// Routes
F.routes.forEach((r) => {
  r.key = `${r.method} ${r.url}`;
  r.href = `#ep/${r.method}${r.url}`;
  r.writes = Object.entries(r.facts.tables).filter(([, ops]) => isWrite(ops)).map(([t]) => t);
  // Errors the guards add (authenticate, requireRole), plus validation.
  r.guardErrors = r.guards.flatMap((g) => F.guards[g]?.errors ?? []).filter((e) => !e.message.startsWith('Dev sign-in'));
});
const ROUTE = new Map(F.routes.map((r) => [r.key, r]));
const FN = new Map(F.functions.map((f) => [f.id, f]));
const modOrder = G.modules.map((m) => m.id);
const byModule = new Map(modOrder.map((id) => [id, F.routes.filter((r) => r.module === id)]));
for (const r of F.routes) if (!byModule.has(r.module)) byModule.set(r.module, [r]);

const describe = (r) => {
  if (r.doc) return r.doc;
  const first = r.handlerCalls.map((id) => FN.get(id)).find((f) => f?.doc && f.file.includes('/modules/'));
  return first ? first.doc : '';
};
const shortDoc = (s, n = 150) => (s && s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s || '');

// Events: who emits them, who handles them.
const EMITTERS = new Map(F.events.map((e) => [e.name, F.routes.filter((r) => r.facts.events.includes(e.name))]));
const HANDLER = new Map(F.eventHandlers.map((h) => [h.event, h]));
// Worker-side emitters (media.ready comes from the media loop).
const LOOP_EMITS = new Map(F.loops.map((l) => [l.name, l.facts.events]));

const perMinute = (rl) => {
  const m = String(rl.timeWindow).match(/(\d+)?\s*(second|minute|hour|day)/);
  const n = Number(m?.[1] ?? 1);
  const unit = { second: 1 / 60, minute: 1, hour: 60, day: 1440 }[m?.[2] ?? 'minute'];
  return rl.max / (n * unit);
};

// ------------------------------------------------------------ JSON Schema → fields and samples
function typeOf(s) {
  if (!s) return 'any';
  if (s.anyOf) {
    const parts = s.anyOf.filter((x) => x.type !== 'null').map(typeOf);
    return uniq(parts).join(' | ') + (s.anyOf.some((x) => x.type === 'null') ? ' | null' : '');
  }
  if (s.enum) return s.enum.map((v) => JSON.stringify(v)).join(' | ');
  if (s.const !== undefined) return JSON.stringify(s.const);
  if (s.type === 'array') return `${typeOf(s.items)}[]`;
  if (s.format === 'uuid') return 'uuid';
  if (s.type === 'string' && s.pattern === '^[a-z0-9]+(?:-[a-z0-9]+)*$') return 'slug';
  if (s.format) return `${s.type} (${s.format})`;
  return Array.isArray(s.type) ? s.type.join(' | ') : s.type || 'any';
}
function rulesOf(s) {
  if (!s) return [];
  if (s.anyOf) return uniq(s.anyOf.flatMap(rulesOf));
  const out = [];
  if (s.minLength !== undefined && s.maxLength !== undefined) out.push(`${s.minLength}–${s.maxLength} chars`);
  else if (s.maxLength !== undefined) out.push(`≤ ${s.maxLength} chars`);
  else if (s.minLength !== undefined) out.push(`≥ ${s.minLength} chars`);
  if (s.minimum !== undefined && s.maximum !== undefined) out.push(`${s.minimum}–${s.maximum}`);
  else if (s.maximum !== undefined) out.push(`≤ ${s.maximum}`);
  else if (s.minimum !== undefined) out.push(`≥ ${s.minimum}`);
  if (s.exclusiveMinimum !== undefined) out.push(`> ${s.exclusiveMinimum}`);
  if (s.minItems !== undefined) out.push(`≥ ${s.minItems} items`);
  if (s.maxItems !== undefined) out.push(`≤ ${s.maxItems} items`);
  if (s.pattern && !s.format && s.pattern !== '^[a-z0-9]+(?:-[a-z0-9]+)*$') out.push(`pattern <code>${esc(s.pattern.length > 60 ? s.pattern.slice(0, 57) + '…' : s.pattern)}</code>`);
  if (s.default !== undefined) out.push(`default <code>${esc(JSON.stringify(s.default))}</code>`);
  return out;
}
function flatten(schema, prefix = '', required = []) {
  const rows = [];
  const s = schema?.anyOf ? schema.anyOf.find((x) => x.type === 'object') ?? schema : schema;
  if (!s || s.type !== 'object' || !s.properties) return rows;
  for (const [name, p] of Object.entries(s.properties)) {
    const full = prefix + name;
    rows.push({ name: full, type: typeOf(p), req: (s.required ?? []).includes(name), rules: rulesOf(p) });
    const inner = p.type === 'array' ? p.items : p;
    if (inner?.type === 'object' && inner.properties) rows.push(...flatten(inner, `${full}${p.type === 'array' ? '[]' : ''}.`));
  }
  return rows;
}
function sample(s, name = '') {
  if (!s) return null;
  if (s.default !== undefined) return s.default;
  if (s.anyOf) return sample(s.anyOf.find((x) => x.type !== 'null') ?? s.anyOf[0], name);
  if (s.enum) return s.enum[0];
  if (s.const !== undefined) return s.const;
  switch (Array.isArray(s.type) ? s.type[0] : s.type) {
    case 'object': {
      const o = {};
      const req = s.required ?? [];
      const keys = Object.keys(s.properties ?? {});
      for (const k of keys.filter((k) => req.includes(k)).concat(req.length ? [] : keys.slice(0, 1))) o[k] = sample(s.properties[k], k);
      return o;
    }
    case 'array': return s.items ? [sample(s.items, name)] : [];
    case 'string':
      if (s.format === 'uuid') return '7f3c2a10-5b1e-4c8d-9a2f-1e0d3c4b5a69';
      if (s.format === 'email' || /email/.test(name)) return 'reader@example.com';
      if (s.format === 'date') return '2026-11-26';
      if (s.format === 'date-time') return '2026-11-26T10:00:00Z';
      if (s.format === 'uri' || /url/.test(name)) return 'https://example.com';
      if (s.pattern === '^[a-z0-9]+(?:-[a-z0-9]+)*$') return 'attention-mechanism';
      if (/password/.test(name)) return 'correct-horse-battery';
      if (/code/.test(name)) return '123456';
      return name ? `${name.replace(/_/g, ' ')}` : 'text';
    case 'integer': case 'number': return s.minimum ?? (s.exclusiveMinimum !== undefined ? s.exclusiveMinimum + 1 : 1);
    case 'boolean': return true;
  }
  return null;
}
function curlFor(r) {
  const base = G.project.baseUrl;
  let url = r.url.replace(/:([a-zA-Z_]+)/g, (_, p) => {
    const ps = r.schema.params?.properties?.[p];
    return encodeURIComponent(String(sample(ps, p) ?? p));
  }).replace('*', 'index.m3u8');
  const q = r.schema.querystring;
  if (q?.required?.length) url += '?' + q.required.map((k) => `${k}=${encodeURIComponent(sample(q.properties[k], k))}`).join('&');
  const lines = [`curl -X ${r.method} '${base}${url}'`];
  if (r.access === 'user' || r.access === 'moderator' || r.access === 'admin') lines.push(`  -H 'x-dev-user: ${G.project.devUser}'`);
  if (r.schema.body) {
    lines.push(`  -H 'content-type: application/json'`);
    lines.push(`  -d '${JSON.stringify(sample(r.schema.body))}'`);
  }
  return lines.join(' \\\n');
}

const NS = 'http://www.w3.org/2000/svg';
const tw = (s, px = 13, mono = false) => String(s).length * px * (mono ? 0.6 : 0.56);
const curve = (x1, y1, x2, y2) => {
  const dx = Math.max(40, (x2 - x1) / 2);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
};
function focusable(svg, onPick) {
  // Click a node to focus it and its edges; click again or press Escape to clear.
  let current = null;
  const apply = (id) => {
    current = id;
    svg.classList.toggle('focusing', !!id);
    svg.querySelectorAll('.on').forEach((n) => n.classList.remove('on'));
    if (id) {
      const ids = new Set([id]);
      svg.querySelectorAll('.edge').forEach((e) => {
        const ends = (e.dataset.ends || '').split(' ');
        if (ends.includes(id)) { e.classList.add('on'); ends.forEach((x) => ids.add(x)); }
      });
      svg.querySelectorAll('.node').forEach((n) => { if (ids.has(n.dataset.id)) n.classList.add('on'); });
    }
    onPick?.(id);
  };
  svg.addEventListener('click', (ev) => {
    const node = ev.target.closest('.node');
    if (!node) return apply(null);
    if (node.dataset.href) { location.hash = node.dataset.href; return; }
    apply(current === node.dataset.id ? null : node.dataset.id);
  });
  svg.addEventListener('keydown', (ev) => {
    const node = ev.target.closest('.node');
    if (ev.key === 'Escape') apply(null);
    if (node && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); node.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  return apply;
}

function moduleTables() {
  // module → table → { ops, routes }
  const map = new Map();
  for (const r of F.routes) {
    if (!map.has(r.module)) map.set(r.module, new Map());
    const mt = map.get(r.module);
    for (const [t, ops] of Object.entries(r.facts.tables)) {
      if (!mt.has(t)) mt.set(t, { ops: new Set(), routes: [] });
      ops.forEach((o) => mt.get(t).ops.add(o));
      mt.get(t).routes.push({ r, ops });
    }
  }
  return map;
}

function tableOrder() {
  const listed = F.areas.flatMap((a) => a.tables);
  return listed.concat(F.tables.filter((t) => !listed.includes(t)));
}

    lastArea = a;
    tY.set(t, yy);
    yy += rowT;
  }
  const stepM = Math.max(rowM, (yy - 40 - 26) / Math.max(1, mods.length - 1));
  const mY = new Map(mods.map((m, i) => [m, 40 + i * stepM]));
  void H;
  const parts = [];

  for (const t of tables) {

  const svg = `<svg class="dia" id="bip" viewBox="0 0 1120 ${yy + 30}" style="min-width:900px" role="group" aria-label="Modules and tables">${parts.join('')}</svg>`;
