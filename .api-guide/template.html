      if (id.startsWith('m:')) {
        const m = id.slice(2);
        const rows = [...MT.get(m)].sort((a, b) => Number(isWrite([...b[1].ops])) - Number(isWrite([...a[1].ops])));
        panel.innerHTML = `<h3>${esc(MODS.get(m)?.name ?? m)}</h3><p class="hint">${md(MODS.get(m)?.desc ?? '')} <a href="#endpoints?m=${m}">${plural(byModule.get(m).length, 'endpoint')} →</a></p>
          <ul class="tlist">${rows.map(([t, v]) => `<li><span class="sw" style="--c:${areaColor(t)}"></span><a href="${tableHref(t)}">${t}</a><span class="hint">${plural(v.routes.length, 'endpoint')}</span><span class="ops">${opsHtml([...v.ops])}</span></li>`).join('')}</ul>`;
      } else {
        const t = id.slice(2);
        const rs = F.routes.filter((r) => r.facts.tables[t]);
        panel.innerHTML = `<h3 class="t">${t}</h3><p class="hint">${esc(AREA_OF.get(t)?.name ?? '')} · <a href="${tableHref(t)}">open in the schema guide ↗</a></p>${miniEps(rs, (r) => opsHtml(r.facts.tables[t]))}`;
      }
    });
  });
  return `<div class="controls">
      <label class="toggle"><input type="checkbox" id="show-reads"> Show reads too</label>
      <label class="toggle"><input type="checkbox" id="hide-plumbing" checked> Hide outbox_events and audit_log</label>
      <div class="legend" style="margin:0"><span class="line" style="--c:var(--a4)">writes (table's area colour)</span><span class="line" style="--c:var(--line-2)">reads only</span></div>
    </div>
    <div class="panel" id="bip-panel"><p class="hint" style="margin:0">Click a module or a table.</p></div>
    <div class="canvas">${svg}</div>`;
}

function miniEps(rs, extra) {
  if (!rs.length) return '<p class="empty">None.</p>';
  return `<ul class="mini-eps">${rs.map((r) => `<li>${meth(r.method)}<a href="${r.href}">${esc(r.url)}</a>${extra ? extra(r) : ''}</li>`).join('')}</ul>`;
}

function matrix() {
  const MT = moduleTables();
  const tables = tableOrder().filter((t) => [...MT.values()].some((mt) => mt.has(t)));
  const areaRuns = [];
  for (const t of tables) {
    const a = AREA_OF.get(t) ?? { id: 'other', name: 'Other', i: 7 };
    if (areaRuns.length && areaRuns[areaRuns.length - 1].id === a.id) areaRuns[areaRuns.length - 1].n++;
    else areaRuns.push({ ...a, n: 1 });
  }
  const max = Math.max(...[...MT.values()].flatMap((mt) => [...mt.values()].map((v) => v.routes.length)));
  let body = '';
  for (const g of G.groups) {
    body += `<tr class="group"><th>${esc(g.name)}</th>${tables.map(() => '<td></td>').join('')}</tr>`;
    for (const m of G.modules.filter((x) => x.group === g.id)) {
      const mt = MT.get(m.id) ?? new Map();
      body += `<tr><th>${esc(m.name)}<small>${byModule.get(m.id)?.length ?? 0}</small></th>${tables.map((t) => {
        const v = mt.get(t);
        if (!v) return '<td></td>';
        const w = isWrite([...v.ops]);
        const k = Math.round(18 + (v.routes.length / max) * 62);
        return `<td><button class="${w ? 'w' : 'r'}" style="--c:${areaColor(t)};--k:${k}" data-m="${m.id}" data-t="${t}" title="${esc(m.name)} · ${t}: ${[...v.ops].join(', ')} · ${plural(v.routes.length, 'endpoint')}">${w ? 'W' : 'R'}</button></td>`;
      }).join('')}</tr>`;
    }
  }
  setTimeout(() => {
    const wrap = document.querySelector('.matrix-wrap');
    if (!wrap) return;
    wrap.addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-m]');
      if (!b) return;
      wrap.querySelectorAll('[aria-pressed="true"]').forEach((x) => x.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed', 'true');
      const v = MT.get(b.dataset.m).get(b.dataset.t);
      document.getElementById('mx-panel').innerHTML = `<h3>${esc(MODS.get(b.dataset.m)?.name)} · <span class="t">${b.dataset.t}</span></h3>
        <p class="hint">${opsHtml([...v.ops])} · <a href="${tableHref(b.dataset.t)}">table in the schema guide ↗</a></p>${miniEps(v.routes.map((x) => x.r), (r) => opsHtml(r.facts.tables[b.dataset.t]))}`;
    });
  });
  return `<div class="legend"><span style="--c:var(--a4)">W: some endpoint inserts, updates or deletes (table's area colour)</span><span style="--c:var(--line-2)">R: read only</span></div>
  <div class="panel" id="mx-panel"><p class="hint" style="margin:0">Click a cell.</p></div>
  <div class="matrix-wrap"><table class="matrix">
    <thead><tr><th style="height:26px"></th>${areaRuns.map((a) => `<th class="area" colspan="${a.n}" style="--c:var(--a${a.i % 8})" title="${esc(a.name)}"><span>${esc(a.name)}</span></th>`).join('')}</tr>
    <tr class="names"><th></th>${tables.map((t) => `<th><span class="rot"><a href="${tableHref(t)}">${t}</a></span></th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

// ---------------- Endpoints list
const filterState = { q: '', m: new Set(), a: new Set(), x: new Set(), mod: null };
views.endpoints = (_, params) => {
  filterState.mod = params.get('m');
  filterState.a = new Set(params.get('a') ? [params.get('a')] : []);
  filterState.q = params.get('q') ?? filterState.q;
  const methods = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'];
  const extras = [['w', 'Writes data'], ['e', 'Emits events'], ['rl', 'Rate limited'], ['au', 'Audited']];
  setTimeout(() => {
    const input = document.getElementById('q');
    if (!input) return;
    input.value = filterState.q;
    input.addEventListener('input', () => { filterState.q = input.value; renderList(); });
    document.querySelectorAll('.fbtn').forEach((b) => b.addEventListener('click', () => {
      const set = filterState[b.dataset.k];
      set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
      b.setAttribute('aria-pressed', set.has(b.dataset.v));
      renderList();
    }));
    renderList();
    if (!filterState.mod) input.focus({ preventScroll: true });
  });
  const mod = filterState.mod && MODS.get(filterState.mod);
  return `${mod ? `<div class="crumbs"><a href="#endpoints">All endpoints</a><span aria-hidden="true">›</span><span>${esc(mod.name)}</span></div>` : ''}
  <h1>${mod ? esc(mod.name) : 'Endpoints'}</h1>
  <p class="lede">${mod ? md(mod.desc) : `All ${F.routes.length} routes the API registers, grouped by module. Search matches paths, descriptions, functions and table names. Press <span class="kbd">/</span> to search.`}</p>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Search: like, papers, notifications, :slug…" aria-label="Search endpoints" autocomplete="off">
    <div class="filters">
      <span class="lab">Method</span>${methods.map((m) => `<button class="fbtn m-${m}" data-k="m" data-v="${m}" aria-pressed="${filterState.m.has(m)}">${m}</button>`).join('')}
      <span class="lab">Access</span>${G.access.map((a) => `<button class="fbtn x-${a.id}" data-k="a" data-v="${a.id}" aria-pressed="${filterState.a.has(a.id)}">${esc(a.name)}</button>`).join('')}
      <span class="lab">Has</span>${extras.map(([v, l]) => `<button class="fbtn" data-k="x" data-v="${v}" aria-pressed="${filterState.x.has(v)}">${l}</button>`).join('')}
    </div>
    <p class="count" id="count"></p>
  </div>
  <div id="list"></div>`;
};

function matches(r) {
  const s = filterState;
  if (s.mod && r.module !== s.mod) return false;
  if (s.m.size && !s.m.has(r.method)) return false;
  if (s.a.size && !s.a.has(r.access)) return false;
  if (s.x.has('w') && !r.writes.length) return false;
  if (s.x.has('e') && !r.facts.events.length) return false;
  if (s.x.has('rl') && !r.rateLimit) return false;
  if (s.x.has('au') && !r.facts.audits.length) return false;
  if (s.q.trim()) {
    const hay = [r.method, r.url, r.module, MODS.get(r.module)?.name, r.section, describe(r), ...Object.keys(r.facts.tables), ...r.facts.events, ...r.handlerCalls.map((c) => c.split('#')[1])].join(' ').toLowerCase();
    if (!s.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w))) return false;
  }
  return true;
}

function renderList() {
  const list = document.getElementById('list');
  if (!list) return;
  let total = 0;
  const html = [...byModule].map(([id, rs]) => {
    const shown = rs.filter(matches);
    total += shown.length;
    if (!shown.length) return '';
    const m = MODS.get(id) ?? { name: id, desc: '' };
    let lastSec = null;
    const items = shown.map((r) => {
      const sec = r.section && r.section !== lastSec ? `<li class="sec">${esc(r.section)}</li>` : '';
      lastSec = r.section ?? lastSec;
      const marks = [
        r.access !== 'user' ? accessBadge(r.access) : '',
        r.writes.length ? `<span class="tag w" title="Writes ${r.writes.join(', ')}">writes ${r.writes.filter((t) => t !== 'outbox_events' && t !== 'audit_log').length || r.writes.length}</span>` : '',
        r.facts.events.length ? `<span class="tag ev" title="${r.facts.events.join(', ')}">⚡ ${esc(r.facts.events.join(', '))}</span>` : '',
        r.rateLimit ? `<span class="tag rl" title="Rate limit">${r.rateLimit.max}/${esc(r.rateLimit.timeWindow.replace('1 ', ''))} per ${r.rateLimit.per}</span>` : '',
      ].join('');
      const d = shortDoc(describe(r), 140);
      return `${sec}<li><a href="${r.href}">${meth(r.method)}<span class="path">${pathHtml(r.url)}</span><span class="marks">${marks}</span>${d ? `<span class="desc">${md(d)}</span>` : ''}</a></li>`;
    }).join('');
    return `<section class="mod"><div class="mod-head"><h2>${filterState.mod ? 'Endpoints' : `<a href="#endpoints?m=${id}" style="color:inherit;text-decoration:none">${esc(m.name)}</a>`}</h2>${filterState.mod ? '' : `<p class="hint">${md(shortDoc(m.desc, 110))}</p>`}<span class="n">${shown.length}</span></div><ul class="eps">${items}</ul></section>`;
  }).join('');
  list.innerHTML = html || '<p class="empty">No endpoint matches. Clear a filter or the search.</p>';
  document.getElementById('count').textContent = `${total} of ${filterState.mod ? byModule.get(filterState.mod).length : F.routes.length} shown`;
}

// ---------------- Endpoint page
function stagesFor(r) {
  const S = G.stages;
  const staff = r.access === 'admin' || r.access === 'moderator';
  const signed = r.access === 'user' || staff;
  const parts = Object.keys(r.schema);
  const tables = Object.entries(r.facts.tables);
  const writes = tables.filter(([, o]) => isWrite(o));
  const reads = tables.filter(([, o]) => !isWrite(o));
  const fns = r.handlerCalls.map((id) => FN.get(id)).filter(Boolean);
  return [
    { id: 'front', h: 'Front door', c: 'var(--ink)', b: 'Fastify', t: 'request id · CORS · compress · ETag' },
    { id: 'auth', h: 'Sign-in', c: 'var(--accent)', on: signed || r.access === 'token', b: signed ? 'authenticate' : r.access === 'token' ? 'signed token in path' : 'not needed', t: signed ? 'JWT + live session + active account' : r.access === 'token' ? 'HMAC token, checked in the handler' : 'public route' },
    { id: 'role', h: 'Staff', c: 'var(--red)', on: staff, b: staff ? `requireRole('${r.access}')` : 'not a staff route', t: staff ? 'role + two-factor sign-in' : '' },
    { id: 'limit', h: 'Rate limit', c: 'var(--amber)', on: !!r.rateLimit, b: r.rateLimit ? `${r.rateLimit.max} / ${r.rateLimit.timeWindow}` : 'no limit', t: r.rateLimit ? `per ${r.rateLimit.per === 'ip' ? 'IP address' : 'signed-in user'}` : '' },
    { id: 'validate', h: 'Validate', c: 'var(--violet)', on: parts.length > 0, b: parts.length ? 'zod' : 'no input', t: parts.join(' · ') },
    { id: 'handler', h: 'Handler', c: 'var(--ink)', b: r.file.split('/').pop(), t: fns.length ? fns.map((f) => f.name + '()').join(', ') : 'inline', href: srcHref(r.file, r.line) },
    { id: 'db', h: 'Postgres', c: 'var(--green)', on: tables.length > 0, b: tables.length ? `${plural(writes.length, 'write')} · ${plural(reads.length, 'read')}` : 'no tables', t: writes.map(([t]) => t).slice(0, 4).join(', ') + (writes.length > 4 ? '…' : '') },
    { id: 'response', h: 'Response', c: 'var(--blue)', b: r.success.join(' / '), t: `${plural(uniq(r.facts.errors.concat(r.guardErrors).map((e) => e.code)).length, 'error code')}`, end: true },
  ];
}
function flowHtml(r, now) {
  const st = stagesFor(r);
  const evs = r.facts.events.filter((e) => e !== 'search.sync');
  const after = r.facts.events.length ? `<div class="after">after the response · worker</div><div class="flow">${r.facts.events.map((e) => {
    const h = HANDLER.get(e);
    const eff = h ? [...h.facts.notifications.map((n) => `notification: ${n}`), ...h.facts.providers.filter((p) => p !== 'storage'), ...Object.entries(h.facts.tables).filter(([, o]) => isWrite(o)).map(([t]) => t)] : [];
    return `<div class="stage${now === 'outbox' ? ' now' : ''}" style="--c:var(--amber)"><h4>Outbox event</h4><b><a href="#events/${e}">${esc(e)}</a></b><span class="t">${e === 'search.sync' ? 'no consumer yet (future search indexer)' : esc(uniq(eff).join(' · ') || 'handled by the worker')}</span></div>`;
  }).join('')}</div>` : '';
  void evs;
  return `<div class="flow">${st.map((s) => `<div class="stage${s.on === false ? ' off' : ''}${now === s.id ? ' now' : ''}${s.end ? ' end' : ''}" style="--c:${s.c}"><h4>${esc(s.h)}</h4><b class="${['handler'].includes(s.id) ? 't' : ''}">${s.href ? `<a href="${s.href}">${esc(s.b)}</a>` : esc(s.b)}</b><span class="t">${esc(s.t)}</span></div>`).join('')}</div>${after}`;
}

function fieldsHtml(r) {
  const parts = [['params', 'Path parameters'], ['querystring', 'Query string'], ['body', 'JSON body']];
  const blocks = parts.filter(([k]) => r.schema[k]).map(([k, label]) => {
    const rows = flatten(r.schema[k]);
    return `<h3 style="margin-top:22px">${label}</h3>${rows.length ? `<table class="fields"><thead><tr><th>Field</th><th>Type</th><th>Rules</th></tr></thead><tbody>${rows.map((f) => `<tr><td class="f">${esc(f.name)}${f.req ? '<span class="req">REQUIRED</span>' : ''}</td><td class="ty">${esc(f.type)}</td><td class="c">${f.rules.join(' · ') || '—'}</td></tr>`).join('')}</tbody></table>` : `<p class="hint">${esc(typeOf(r.schema[k]))}</p>`}`;
  });
  const curl = curlFor(r);
  return `${blocks.length ? blocks.join('') : '<p class="empty">This endpoint takes no parameters, query string or body.</p>'}
    <div class="codehead"><h3>Try it locally</h3><button class="copy" data-copy="curl">Copy</button></div>
    <pre class="code" id="curl">${esc(curl)}</pre>
    <p class="hint" style="margin-top:8px">${r.access === 'public' || r.access === 'token' ? 'No sign-in needed.' : `Dev runs with <code>DEV_AUTH_BYPASS</code>: a request without <code>Authorization</code> acts as <code>DEV_AUTH_USER</code>, or the username in <code>x-dev-user</code>.${r.access !== 'user' ? ' The seeded admin counts as two-factor signed in.' : ''}`} Sample values come from the schema; ids are placeholders.</p>`;
}

function dataHtml(r) {
  const t = Object.entries(r.facts.tables).sort((a, b) => Number(isWrite(b[1])) - Number(isWrite(a[1])) || a[0].localeCompare(b[0]));
  const g = r.guards.flatMap((x) => Object.keys(F.guards[x]?.tables ?? {}));
  return `<div class="data-grid">
    <div class="card"><h3>Tables · ${t.length}</h3>${t.length ? `<ul class="tlist">${t.map(([n, ops]) => `<li><span class="sw" style="--c:${areaColor(n)}"></span><a href="${tableHref(n)}">${n}</a><span class="ops">${opsHtml(ops)}</span></li>`).join('')}</ul>` : '<p class="empty">None.</p>'}
      ${g.length ? `<p class="hint" style="margin:10px 0 0">Plus the sign-in check: ${uniq(g).map((x) => `<code>${x}</code>`).join(', ')} (one indexed query).</p>` : ''}</div>
    <div class="card"><h3>Outbox events</h3>${r.facts.events.length ? `<div class="chips">${r.facts.events.map((e) => `<a class="chip" href="#events/${e}">⚡ ${esc(e)}</a>`).join('')}</div>${r.facts.searchSync.length ? `<p class="hint" style="margin:8px 0 0">search.sync for: ${r.facts.searchSync.map((x) => `<code>${esc(x)}</code>`).join(', ')}</p>` : ''}` : '<p class="empty">None: nothing happens after the response.</p>'}
      <h3 style="margin-top:16px">Audit log</h3>${r.facts.audits.length ? `<div class="chips">${r.facts.audits.map((a) => `<span class="chip">${esc(a)}</span>`).join('')}</div>` : '<p class="empty">Not audited.</p>'}
      <h3 style="margin-top:16px">Outside services</h3>${r.facts.providers.length ? `<div class="chips">${r.facts.providers.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}</div>` : '<p class="empty">None.</p>'}</div>
  </div>
  ${Object.keys(r.facts.tables).some((x) => x === 'blocks' || x === 'follows') && r.method === 'GET' ? '<p class="hint" style="margin-top:14px">Reads of <code>blocks</code> and <code>follows</code> here are the visibility rules from <code>db/visibility.ts</code>: blocks both ways, private accounts, drafts and deleted rows.</p>' : ''}`;
}

function errorsHtml(r) {
  const val = Object.keys(r.schema).length ? [{ status: 400, code: 'VALIDATION_ERROR', message: 'Invalid request (details lists each problem)', from: 'zod' }] : [];
  const rl = r.rateLimit ? [{ status: 429, code: 'FST_ERR_RATE_LIMIT', message: `Rate limit exceeded (${r.rateLimit.max} per ${r.rateLimit.timeWindow})`, from: 'rate limit' }] : [];
  const all = [...r.guardErrors.map((e) => ({ ...e, from: 'guard' })), ...rl, ...val, ...r.facts.errors.map((e) => ({ ...e, from: 'code' }))];
  const seen = new Set();
  const list = all.filter((e) => { const k = e.status + e.code + e.message; if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => a.status - b.status);
  return `<p class="hint">Every error is <code>{ error: { code, message, request_id, details? } }</code>. Database constraint failures map to 409 ALREADY_EXISTS / IN_USE and 400 INVALID_REFERENCE / INVALID_DATA (<a href="#ref/errors">all codes</a>).</p>
  <ul class="errs">${list.map((e) => `<li class="s${String(e.status)[0]}"><span class="st">${e.status}</span><span class="cd">${esc(e.code)}<small>${esc(e.from)}</small></span><span>${esc(e.message)}</span></li>`).join('')}</ul>`;
}

const trivial = (f) => !f.calls.length && !Object.keys(f.own.tables).length && !f.own.events.length && !f.own.errors.length;
function treeHtml(ids, depth = 0, seen = new Set()) {
  if (!ids.length || depth > 7) return '';
  const helpers = ids.map((id) => FN.get(id)).filter((f) => f && trivial(f));
  const main = ids.filter((id) => FN.get(id) && !trivial(FN.get(id)));
  const tail = helpers.length ? `<li><span class="hint">helpers: ${helpers.map((f) => `<a class="src" href="${srcHref(f.file, f.line)}">${esc(f.name)}()</a>`).join(', ')}</span></li>` : '';
  return `<ul class="tree"${depth ? '' : ' style="padding:0"'}>${main.map((id) => {
    const f = FN.get(id);
    if (!f) return '';
    const own = Object.entries(f.own.tables);
    const interesting = own.length || f.own.events.length || f.own.errors.length || f.calls.length;
    const again = seen.has(id);
    const next = new Set(seen).add(id);
    return `<li><div class="fn"><span class="nm${interesting ? '' : ' dim'}">${esc(f.name)}()</span>${srcLink(f.file, f.line)}
      ${f.doc && depth < 3 ? `<span class="doc">${md(shortDoc(f.doc, 200))}</span>` : ''}
      ${own.length || f.own.events.length ? `<span class="own">${own.map(([t, ops]) => `<span class="mini" style="--c:${areaColor(t)}">${t} ${ops.map((o) => `<span class="op ${o}">${o[0].toUpperCase()}</span>`).join('')}</span>`).join('')}${f.own.events.map((e) => `<span class="mini" style="--c:var(--amber)">⚡ ${esc(e)}</span>`).join('')}</span>` : ''}
    </div>${again ? '' : treeHtml(f.calls, depth + 1, next)}</li>`;
  }).join('')}${tail}</ul>`;
}

views.ep = (rest) => {
  const [keyPart, tab = 'flow'] = rest.split('@');
  const m = keyPart.match(/^([A-Z]+)(\/.*)$/);
  const r = m && ROUTE.get(`${m[1]} ${m[2]}`);
  if (!r) return `<h1>Not found</h1><p>No endpoint <code>${esc(rest)}</code>. <a href="#endpoints">All endpoints</a></p>`;
  const mod = MODS.get(r.module);
  const tabs = [['flow', 'Flow'], ['request', 'Request'], ['data', 'Data', Object.keys(r.facts.tables).length], ['errors', 'Errors', uniq(r.facts.errors.concat(r.guardErrors).map((e) => e.code)).length], ['code', 'Code path', r.handlerCalls.length]];
  const body = { flow: () => flowHtml(r) + flowNotes(r), request: () => fieldsHtml(r), data: () => dataHtml(r), errors: () => errorsHtml(r), code: () => `<p class="hint">The functions the handler calls, and what they call in turn, with the tables each one touches itself. Small helpers that touch nothing are listed at the end of their level.</p>${r.handlerCalls.length ? treeHtml(r.handlerCalls) : '<p class="empty">The handler does its work inline.</p>'}` }[tab] ?? (() => '');
  const siblings = byModule.get(r.module);
  const idx = siblings.indexOf(r);
  const prev = siblings[idx - 1], next = siblings[idx + 1];
  setTimeout(() => {
    document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
      navigator.clipboard?.writeText(document.getElementById(b.dataset.copy).textContent).then(() => { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1500); });
    }));
  });
  return `<div class="crumbs"><a href="#endpoints">Endpoints</a><span aria-hidden="true">›</span><a href="#endpoints?m=${r.module}">${esc(mod?.name ?? r.module)}</a>${r.section ? `<span aria-hidden="true">›</span><span>${esc(r.section)}</span>` : ''}</div>
  <div class="ep-title">${meth(r.method, true)}<span class="path">${pathHtml(r.url)}</span></div>
  ${describe(r) ? `<p class="lede">${md(describe(r))}${!r.doc ? ' <span class="hint">(from the service function)</span>' : ''}</p>` : ''}
  <ul class="facts">
    <li>${accessBadge(r.access)}</li>
    <li>Success <b>${r.success.join(', ')}</b></li>
    <li>${r.rateLimit ? `Limit <b>${r.rateLimit.max} / ${esc(r.rateLimit.timeWindow)}</b> per ${r.rateLimit.per}` : 'No rate limit'}</li>
    <li>${r.line ? srcLink(r.file, r.line) : `<span class="hint">${esc(r.plugin)}</span>`}</li>
    ${r.plugin.startsWith('lifecycleRoutes') ? `<li><span class="hint">shared ${esc(r.plugin)}</span></li>` : ''}
  </ul>
  <nav class="tabs">${tabs.map(([id, label, n]) => `<a href="${r.href}${id === 'flow' ? '' : '@' + id}" ${id === tab ? 'aria-current="page"' : ''}>${label}${n ? `<small>${n}</small>` : ''}</a>`).join('')}</nav>
  ${body()}
  <div class="tour-nav">${prev ? `<a class="btn" href="${prev.href}">← ${prev.method} ${esc(prev.url)}</a>` : '<span></span>'}${next ? `<a class="btn" href="${next.href}">${next.method} ${esc(next.url)} →</a>` : '<span></span>'}</div>`;
};
function flowNotes(r) {
  return `<p class="hint" style="margin-top:6px">Dashed stages don't apply to this endpoint. <a href="#journey/0/${r.method}${r.url}">Walk through it step by step →</a></p>`;
}

// ---------------- Journey
views.journey = (rest) => {
  let step = 0, key = G.journey.default;
  const m = (rest || '').match(/^(\d+)\/([A-Z]+)(\/.*)$/);
  if (m) { step = Number(m[1]); key = `${m[2]} ${m[3]}`; }
  const r = ROUTE.get(key) ?? F.routes[0];
  const steps = journeySteps(r);
  step = Math.min(Math.max(step, 0), steps.length - 1);
  const s = steps[step];
  const href = (i) => `#journey/${i}/${r.method}${r.url}`;
  setTimeout(() => {
    const sel = document.getElementById('jpick');
    sel?.addEventListener('change', () => { location.hash = `#journey/0/${sel.value.replace(' ', '')}`; });
    teardown = (() => {
      const onKey = (e) => {
        if (e.target.closest('input,select,textarea')) return;
        if (e.key === 'ArrowRight' && step < steps.length - 1) location.hash = href(step + 1);
        if (e.key === 'ArrowLeft' && step > 0) location.hash = href(step - 1);
      };
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    })();
  });
  const opts = [...byModule].map(([id, rs]) => `<optgroup label="${esc(MODS.get(id)?.name ?? id)}">${rs.map((x) => `<option value="${esc(x.key)}" ${x === r ? 'selected' : ''}>${esc(x.key)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="pick"><span>Follow</span><select class="big-select" id="jpick" aria-label="Endpoint to follow">${opts}</select></div>
  <nav class="row-progress" style="--n:${steps.length}" aria-label="Steps">${steps.map((x, i) => `<a href="${href(i)}" class="${i < step ? 'done' : i === step ? 'now' : ''}" title="${esc(x.title)}" aria-label="Step ${i + 1}: ${esc(x.title)}"></a>`).join('')}</nav>
  <p class="step-count">Step ${step + 1} of ${steps.length} · <span class="kbd">←</span> <span class="kbd">→</span> to move</p>
  <h1>${esc(s.title)}</h1>
  ${flowHtml(r, s.stage)}
  <div style="margin-top:22px">${s.body}</div>
  <div class="tour-nav"><a class="btn" href="${href(step - 1)}" aria-disabled="${step === 0}">← Back</a>${step < steps.length - 1 ? `<a class="btn primary" href="${href(step + 1)}">Next: ${esc(steps[step + 1].title)} →</a>` : `<a class="btn primary" href="${r.href}">Open the endpoint page →</a>`}</div>`;
};

function journeySteps(r) {
  const S = G.stages;
  const fileNote = (st) => (st.file ? `<p class="hint">${srcLink(st.file)}</p>` : '');
  const staff = r.access === 'admin' || r.access === 'moderator';
  const signed = r.access === 'user' || staff;
  const steps = [];
  steps.push({ title: 'The client sends the request', stage: null, body: `<p>${md(describe(r) || 'The app calls this endpoint.')}</p><pre class="code">${esc(curlFor(r))}</pre>` });
  steps.push({ title: S.front.name, stage: 'front', body: `<p>${md(S.front.text)}</p>${fileNote(S.front)}` });
  if (signed) {
    const g = F.guards.authenticate;
    steps.push({ title: 'authenticate: who is calling?', stage: 'auth', body: `<p>${md(S.auth.text)}</p><div class="chips">${Object.entries(g?.tables ?? {}).map(([t, o]) => tableChip(t, o)).join('')}</div><p class="hint" style="margin-top:10px">${srcLink(g.file, g.line)} · fails with ${uniq(g.errors.map((e) => `${e.status} ${e.code}`)).join(', ')}</p>` });
  } else {
    steps.push({ title: r.access === 'token' ? 'The token in the path is the permission' : 'No sign-in on this route', stage: 'auth', body: r.access === 'token' ? '<p>Storage and media URLs carry an HMAC-signed token (derived key per purpose, with an expiry). The handler verifies it; there is no session.</p>' : '<p>This route sits outside the authenticate hook. Public routes that could be abused (sign-in, sign-up, reset) are rate limited per IP instead.</p>' });
  }
  if (staff) steps.push({ title: `requireRole('${r.access}')`, stage: 'role', body: `<p>${md(S.role.text)}</p>${fileNote(S.role)}` });
  if (r.rateLimit) steps.push({ title: `Rate limit: ${r.rateLimit.max} per ${r.rateLimit.timeWindow}`, stage: 'limit', body: `<p>${md(S.limit.text)}</p><p>This route allows <b>${r.rateLimit.max}</b> requests per <b>${esc(r.rateLimit.timeWindow)}</b> per ${r.rateLimit.per === 'ip' ? 'IP address' : 'signed-in user'}.</p>${fileNote(S.limit)}` });
  if (Object.keys(r.schema).length) steps.push({ title: 'zod checks the input', stage: 'validate', body: `<p>${md(S.validate.text)}</p>${fieldsHtml(r).split('<div class="codehead">')[0]}` });
  steps.push({ title: 'The handler calls a service', stage: 'handler', body: `<p>${md(S.handler.text)} ${md(S.service.text)}</p><p class="hint">Route: ${r.line ? srcLink(r.file, r.line) : esc(r.plugin)}</p>${r.handlerCalls.length ? treeHtml(r.handlerCalls) : '<p class="empty">This handler works inline.</p>'}` });
  const t = Object.entries(r.facts.tables);
  if (t.length) steps.push({ title: 'PostgreSQL', stage: 'db', body: `<p>${md(S.db.text)}</p><div class="data-grid"><div class="card"><h3>Writes</h3><div class="chips">${t.filter(([, o]) => isWrite(o)).map(([n, o]) => tableChip(n, o)).join('') || '<span class="hint">Nothing: a read-only endpoint.</span>'}</div></div><div class="card"><h3>Reads</h3><div class="chips">${t.filter(([, o]) => !isWrite(o)).map(([n, o]) => tableChip(n, o)).join('') || '<span class="hint">—</span>'}</div></div></div>` });
  steps.push({ title: `Response: ${r.success.join(' / ')}`, stage: 'response', body: `<p>${md(S.response.text)}</p>${errorsHtml(r)}` });
  for (const e of r.facts.events) {
    const h = HANDLER.get(e);
    const ev = F.events.find((x) => x.name === e);
    steps.push({ title: `After commit: ${e}`, stage: 'outbox', body: `<p>${md(ev?.doc ?? '')}</p><p>${md(S.outbox.text)}</p>${h ? `<div class="data-grid"><div class="card"><h3>Worker handler</h3><p style="margin:0">${srcLink('apps/api/src/worker/outbox.ts', h.line, `worker/outbox.ts:${h.line}`)}</p>${h.doc ? `<p class="hint" style="margin:6px 0 0">${md(h.doc)}</p>` : ''}</div><div class="card"><h3>Effects</h3><div class="chips">${h.facts.notifications.map((n) => `<span class="chip">notification: ${esc(n)}</span>`).join('')}${h.facts.providers.filter((p) => p !== 'storage').map((p) => `<span class="chip">${esc(p)}</span>`).join('')}${Object.entries(h.facts.tables).filter(([, o]) => isWrite(o)).map(([n, o]) => tableChip(n, o)).join('')}</div></div></div>` : '<p class="hint">No consumer yet.</p>'}` });
  }
  return steps;
}

// ---------------- Events
views.events = (focus) => {
  // Columns: emitting modules → events → effects
  const evs = F.events;
  const emitMods = new Map();
  for (const e of evs) {
    for (const r of EMITTERS.get(e.name)) {
      const k = `m:${r.module}`;
      if (!emitMods.has(k)) emitMods.set(k, { id: k, label: MODS.get(r.module)?.name ?? r.module, ev: new Map() });
      const em = emitMods.get(k).ev;
      em.set(e.name, (em.get(e.name) ?? 0) + 1);
    }
  }
  for (const l of F.loops) for (const e of l.facts.events) {
    const k = `loop:${l.name}`;
    if (!emitMods.has(k)) emitMods.set(k, { id: k, label: `${l.name} loop (worker)`, ev: new Map() });
    emitMods.get(k).ev.set(e, 1);
  }
  const rank = (id) => (id.startsWith('loop:') ? 999 : modOrder.indexOf(id.slice(2)));
  const left = [...emitMods.values()].sort((a, b) => rank(a.id) - rank(b.id));
  const effects = new Map();
  const addEff = (id, label, c, ev) => { if (!effects.has(id)) effects.set(id, { id, label, c, ev: new Set() }); effects.get(id).ev.add(ev); };
  for (const h of F.eventHandlers) {
    for (const n of h.facts.notifications) addEff('n:notifications', 'notifications rows', areaColor('notifications'), h.event);
    for (const p of h.facts.providers) if (p !== 'storage') addEff(`p:${p}`, p === 'push' ? 'push to devices' : p === 'email' ? 'email' : p, 'var(--a7)', h.event);
    for (const [t, o] of Object.entries(h.facts.tables)) if (isWrite(o) && t !== 'notifications' && t !== 'outbox_events') addEff(`t:${t}`, `${t} (${o.filter((x) => x !== 'read').join(', ')})`, areaColor(t), h.event);
  }
  const right = [...effects.values()].sort((a, b) => a.id.localeCompare(b.id));
  const rowL = 34, rowE = 46, rowR = 34;
  const H = Math.max(left.length * rowL, evs.length * rowE, right.length * rowR) + 60;
  const lx = 20, lw = 230, ex = 410, ew = 220, rx = 800, rw = 270;
  const yL = (i) => 40 + i * rowL + (H - 60 - left.length * rowL) / 2;
  const yE = (i) => 40 + i * rowE + (H - 60 - evs.length * rowE) / 2;
  const yR = (i) => 40 + i * rowR + (H - 60 - right.length * rowR) / 2;
  const parts = [`<text class="hd" x="${lx}" y="24">Written by</text><text class="hd" x="${ex}" y="24">Event</text><text class="hd" x="${rx}" y="24">Worker does</text>`];
  left.forEach((l, i) => evs.forEach((e, j) => {
    const n = l.ev.get(e.name);
    if (n) parts.push(`<path class="edge" data-ends="${l.id} e:${e.name}" d="${curve(lx + lw, yL(i) + 13, ex, yE(j) + 17)}"><title>${esc(l.label)} → ${e.name}: ${plural(n, 'endpoint')}</title></path>`);
  }));
  right.forEach((rr, i) => evs.forEach((e, j) => {
    if (rr.ev.has(e.name)) parts.push(`<path class="edge async" data-ends="e:${e.name} ${rr.id}" d="${curve(ex + ew, yE(j) + 17, rx, yR(i) + 13)}" style="stroke:${rr.c}"/>`);
  }));
  left.forEach((l, i) => parts.push(`<g class="node" tabindex="0" role="button" data-id="${l.id}"><rect x="${lx}" y="${yL(i)}" width="${lw}" height="26" rx="3"/><text x="${lx + 10}" y="${yL(i) + 17.5}" style="font-size:12.5px">${esc(l.label)}</text></g>`));
  evs.forEach((e, j) => parts.push(`<g class="node" tabindex="0" role="button" data-id="e:${e.name}"><rect x="${ex}" y="${yE(j)}" width="${ew}" height="34" rx="3" style="stroke:var(--amber)"/><rect x="${ex}" y="${yE(j)}" width="4" height="34" style="fill:var(--amber);stroke:none"/><text x="${ex + 12}" y="${yE(j) + 15}" class="mono">${esc(e.name)}</text><text x="${ex + 12}" y="${yE(j) + 28}" class="n">${EMITTERS.get(e.name).length ? plural(EMITTERS.get(e.name).length, 'endpoint') : F.loops.filter((l) => l.facts.events.includes(e.name)).map((l) => `${l.name} loop`).join(', ') || 'no writer'} · entity ${esc(e.entity ?? '?')}</text></g>`));
  right.forEach((rr, i) => parts.push(`<g class="node" tabindex="0" role="button" data-id="${rr.id}"><rect x="${rx}" y="${yR(i)}" width="${rw}" height="26" rx="3" style="stroke:${rr.c}"/><rect x="${rx}" y="${yR(i)}" width="4" height="26" style="fill:${rr.c};stroke:none"/><text x="${rx + 12}" y="${yR(i) + 17.5}" class="mono" style="font-size:11.5px">${esc(rr.label)}</text></g>`));
  setTimeout(() => {
    const svg = document.getElementById('evmap');
    if (!svg) return;
    const apply = focusable(svg, (id) => {
      if (id?.startsWith('e:')) history.replaceState(null, '', `#events/${id.slice(2)}`);
      document.querySelectorAll('.evcard').forEach((c) => (c.style.outline = id && c.id === `ev-${id.slice(2)}` ? '2px solid var(--accent)' : ''));
      if (id?.startsWith('e:')) document.getElementById(`ev-${id.slice(2)}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    if (focus) apply(`e:${focus}`);
  });
  return `<h1>Events</h1>
  <p class="lede">A request never sends a notification, bumps a counter or emails anyone itself. It writes an <code>outbox_events</code> row in the same transaction as its change; the worker's outbox loop picks it up (<a href="#worker">Worker</a>). Click an event to trace it.</p>
  <div class="legend"><span class="line" style="--c:var(--muted)">writes the event (in the request's transaction)</span><span class="dash" style="--c:var(--muted)">worker, after commit</span></div>
  <div class="canvas"><svg class="dia" id="evmap" viewBox="0 0 1090 ${H}" style="min-width:900px" role="group" aria-label="Events">${parts.join('')}</svg></div>
  <section class="block"><h2>Delivery rules</h2><ul class="bul">
    <li>The worker <b>claims</b> an event (sets <code>processed_at</code> only if still empty) and does its database work in one transaction, so counters and notification rows apply exactly once.</li>
    <li>Push and email run <b>after</b> that commit, best effort: a failure is logged, not retried.</li>
    <li>Counters move ±1 per event; the hourly maintenance job recounts them to repair drift.</li>
    <li>Toggle rows (likes, follows) write an event only when the state really changes; only the first like or follow ever notifies.</li>
  </ul></section>
  <section class="block"><h2>Every event</h2>
  ${evs.map((e) => {
    const h = HANDLER.get(e.name);
    const em = EMITTERS.get(e.name);
    const loopEm = F.loops.filter((l) => l.facts.events.includes(e.name)).map((l) => `${l.name} loop`);
    return `<div class="card evcard" id="ev-${e.name}" style="margin-bottom:14px;scroll-margin-top:80px">
      <div class="fn"><span class="nm" style="font-size:1.05rem">⚡ ${esc(e.name)}</span><span class="hint">entity: ${esc(e.entity ?? '?')} · payload <code>${esc(e.payload)}</code></span></div>
      ${e.doc ? `<p style="margin:6px 0 10px;color:var(--ink-2)">${md(e.doc)}</p>` : ''}
      <div class="data-grid">
        <div><h3 style="font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Written by · ${em.length + loopEm.length}</h3>${loopEm.length ? `<p class="hint" style="margin:0 0 4px">${loopEm.join(', ')}</p>` : ''}${miniEps(em)}</div>
        <div><h3 style="font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Worker handler</h3>${h ? `<p style="margin:0 0 6px">${srcLink('apps/api/src/worker/outbox.ts', h.line, `worker/outbox.ts:${h.line}`)}</p>${h.doc ? `<p class="hint">${md(h.doc)}</p>` : ''}<div class="chips">${h.facts.notifications.map((n) => `<span class="chip">notification: ${esc(n)}</span>`).join('')}${h.facts.providers.filter((p) => p !== 'storage').map((p) => `<span class="chip">${esc(p)}</span>`).join('')}${Object.entries(h.facts.tables).map(([t, o]) => tableChip(t, o)).join('')}</div>` : '<p class="empty">None.</p>'}</div>
      </div></div>`;
  }).join('')}</section>`;
};

// ---------------- Worker
views.worker = () => {
  const colors = ['var(--a0)', 'var(--amber)', 'var(--green)', 'var(--violet)'];
  const span = 60000;
  const rows = F.loops.map((l, i) => {
    const c = colors[i % colors.length];
    const ticks = l.idleMs <= span ? Array.from({ length: Math.floor(span / l.idleMs) + 1 }, (_, k) => `<i style="left:${((k * l.idleMs) / span) * 100}%"></i>`).join('') : '';
    const label = l.idleMs >= 3600000 ? `${l.idleMs / 3600000} h` : l.idleMs >= 60000 ? `${l.idleMs / 60000} min` : `${l.idleMs / 1000} s`;
    const pulse = l.idleMs <= span ? `<span class="pulse" style="--d:${Math.max(l.idleMs, 1000) / 1000}s;--to:${(l.idleMs / span) * 100}%"></span>` : '';
    return `<div class="tl-row" style="--c:${c}"><b>${esc(l.name)}<small>every ${label} when idle</small></b><div class="tl-track">${ticks}${pulse}${l.idleMs > span ? '<span class="hint" style="position:absolute;right:0;bottom:2px">once an hour, off this scale →</span>' : ''}</div></div>`;
  }).join('');
  const cards = F.loops.map((l, i) => {
    const c = colors[i % colors.length];
    const entry = FN.get(l.entry[0]);
    const stepIds = l.name === 'outbox' ? [] : entry?.calls ?? [];
    const steps = stepIds.map((id) => FN.get(id)).filter((f) => f && (f.doc || Object.keys(f.own.tables).length || f.calls.length));
    const tables = Object.entries(l.facts.tables);
    return `<div class="loop" style="--c:${c};--cs:color-mix(in srgb,${c} 14%,transparent)">
      <h3>${esc(l.name)} <small>${l.idleMs >= 3600000 ? `${l.idleMs / 3600000} h` : l.idleMs >= 60000 ? `${l.idleMs / 60000} min` : `${l.idleMs / 1000} s`} idle</small></h3>
      <p>${md(G.worker.loops[l.name] ?? l.doc ?? '')}</p>
      <p class="hint" style="margin:0 0 6px">Entry: ${entry ? `<code>${esc(entry.name)}()</code> ${srcLink(entry.file, entry.line)}` : '—'} · started at ${srcLink('apps/api/src/worker.ts', l.line, `worker.ts:${l.line}`)}</p>
      ${l.name === 'outbox' ? `<ol class="steps">${F.eventHandlers.map((h) => `<li><span class="nm"><a href="#events/${h.event}" style="color:inherit">${esc(h.event)}</a></span> ${srcLink('apps/api/src/worker/outbox.ts', h.line, `:${h.line}`)}<span class="d">${esc(uniq([...h.facts.notifications.map((n) => 'notify ' + n), ...h.facts.providers.filter((p) => p !== 'storage'), ...Object.entries(h.facts.tables).filter(([, o]) => isWrite(o)).map(([t, o]) => `${t} ${o.filter((x) => x !== 'read').join('/')}`)]).join(' · ') || 'nothing yet')}</span></li>`).join('')}</ol>` : steps.length ? `<ol class="steps">${steps.map((f) => `<li><span class="nm">${esc(f.name)}()</span> ${srcLink(f.file, f.line, `:${f.line}`)}${f.doc ? `<span class="d">${md(shortDoc(f.doc, 170))}</span>` : ''}</li>`).join('')}</ol>` : ''}
      <div class="chips">${tables.map(([t, o]) => tableChip(t, o)).join('')}${l.facts.providers.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  return `<h1>Worker</h1>
  <p class="lede">${md(G.worker.facts[0])} It runs four loops side by side. Each repeats its work at once while there is work and sleeps its idle interval when there is none.</p>
  <div class="timeline" aria-label="Idle intervals over one minute">${rows}<div class="tl-axis"><span></span><div><span>0 s</span><span>15 s</span><span>30 s</span><span>45 s</span><span>60 s</span></div></div></div>
  <ul class="bul">${G.worker.facts.slice(1).map((f) => `<li>${md(f)}</li>`).join('')}</ul>
  <div class="loops">${cards}</div>`;
};

// ---------------- Access
views.access = () => {
  // A plugin's routes, plus the shared lifecycleRoutes(…) it registers (same module, plugin named after the helper).
  const pluginRoutes = (name) => {
    const own = F.routes.filter((r) => r.plugin === name);
    const mod = own[0]?.module;
    return own.concat(F.routes.filter((r) => r.plugin.startsWith('lifecycleRoutes') && r.module === mod));
  };
  const plug = (p) => {
    const rs = pluginRoutes(p.name);
    return `<a class="plug" href="#endpoints?m=${rs[0]?.module ?? ''}" title="${esc(p.doc ?? p.file)}">${esc(p.name)}<i>${rs.length}</i></a>`;
  };
  const P = (filter) => F.plugins.filter(filter);
  const g = (p) => p.guards.join(' ');
  const tree = `
  <div class="rt x-public" style="--c:var(--line-2);--cs:var(--bg)"><div class="rt-h"><b>/</b><span class="hint">root · no guard</span></div>
    <div class="plugs"><a class="plug" href="#ep/GET/health">GET /health<i>db check</i></a>${P((p) => p.prefix === '/' ).map(plug).join('')}<a class="plug" href="#ep/GET/media/public/*">@fastify/static<i>/media/public</i></a></div>
    <div class="rt x-public"><div class="rt-h"><b>/v1</b><span class="g">no guard</span><span class="hint">versioned API</span></div>
      <div class="plugs">${P((p) => p.prefix === '/v1' && !p.guards.length).map(plug).join('')}${P((p) => p.prefix === '/v1/auth').map((p) => plug(p) + '<span class="hint" style="align-self:center">at /v1/auth, per-IP limits</span>').join('')}</div>
      <div class="rt x-user"><div class="rt-h"><b>/v1</b><span class="g">onRequest: authenticate</span><span class="hint">${md(ACCESS.get('user').desc)}</span></div>
        <div class="plugs">${P((p) => p.prefix === '/v1' && g(p) === 'authenticate').map(plug).join('')}</div>
        <div class="rt x-user" style="--c:var(--line-2)"><div class="rt-h"><b>/v1/admin</b><span class="hint">adminRoutes</span></div>
          <div class="rt x-moderator"><div class="rt-h"><b>/v1/admin</b><span class="g">+ requireRole('moderator')</span><span class="hint">${md(ACCESS.get('moderator').desc)}</span></div><div class="plugs">${P((p) => g(p).includes('requireRole(moderator)')).map(plug).join('')}</div></div>
          <div class="rt x-admin"><div class="rt-h"><b>/v1/admin</b><span class="g">+ requireRole('admin')</span><span class="hint">${md(ACCESS.get('admin').desc)}</span></div><div class="plugs">${P((p) => g(p).includes('requireRole(admin)')).map(plug).join('')}</div></div>
        </div>
      </div>
    </div>
  </div>`;
  const limited = F.routes.filter((r) => r.rateLimit).map((r) => ({ r, pm: perMinute(r.rateLimit) })).sort((a, b) => a.pm - b.pm);
  const maxLog = Math.log10(Math.max(...limited.map((x) => x.pm)) * 1.2);
  const minLog = Math.log10(Math.min(...limited.map((x) => x.pm)) / 2);
  const bars = limited.map(({ r, pm }) => `<li><span class="lbl">${meth(r.method)}<a href="${r.href}" title="${esc(r.url)}">${esc(r.url)}</a></span><span class="track"><span class="fill" style="display:block;width:${((Math.log10(pm) - minLog) / (maxLog - minLog)) * 100}%;--c:${r.rateLimit.per === 'ip' ? 'var(--slate)' : 'var(--amber)'}"></span></span><span class="v">${r.rateLimit.max} / ${esc(r.rateLimit.timeWindow)} · ${r.rateLimit.per}</span></li>`).join('');
  return `<h1>Access</h1>
  <p class="lede">Guards are hooks on plugin scopes in <code>app.ts</code> and <code>admin.routes.ts</code>, so a route's access follows from where it is registered. Click a plugin for its endpoints.</p>
  ${tree}
  <section class="block"><h2>Rate limits <small>${limited.length} routes, strictest first · bar length on a log scale of requests per minute</small></h2>
  <div class="legend"><span style="--c:var(--slate)">per IP (before sign-in)</span><span style="--c:var(--amber)">per signed-in user</span></div>
  <ul class="bars">${bars}</ul>
  <p class="hint" style="margin-top:12px">${md(G.stages.limit.text)} Failed sign-ins also add a growing per-account delay (<code>auth/login-throttle.ts</code>).</p></section>`;
};

// ---------------- Reference
views.ref = (sub = 'errors') => {
  const tabs = [['errors', 'Errors'], ['config', 'Configuration'], ['providers', 'Providers'], ['conventions', 'Conventions'], ['about', 'About this page']];
  let body = '';
  if (sub === 'errors') {
    const codes = new Map();
    const add = (e, r, from) => {
      const k = `${e.status} ${e.code}`;
      if (!codes.has(k)) codes.set(k, { status: e.status, code: e.code, messages: new Set(), routes: new Set(), from });
      codes.get(k).messages.add(e.message);
      if (r) codes.get(k).routes.add(r);
    };
    for (const r of F.routes) { r.facts.errors.forEach((e) => add(e, r, 'code')); r.guardErrors.forEach((e) => add(e, r, 'guard')); }
    F.globalErrors.forEach((e) => add(e, null, 'error handler'));
    const list = [...codes.values()].sort((a, b) => a.status - b.status || b.routes.size - a.routes.size);
    body = `<p class="hint">Codes thrown in the code (found by following each handler), by the guards, and by the global error handler (<code>lib/error-handler.ts</code>). Rate limits answer 429 through the same handler.</p>
    ${list.map((c) => `<details class="s${String(c.status)[0]}"><summary><span class="st">${c.status}</span><span class="cd">${esc(c.code)}</span><span class="ms">${esc([...c.messages][0])}${c.messages.size > 1 ? ` <span class="hint">+${c.messages.size - 1} more</span>` : ''}</span><span class="n">${c.routes.size ? plural(c.routes.size, 'endpoint') : esc(c.from)}</span></summary><div class="inner">
      ${c.messages.size > 1 ? `<ul class="bul" style="margin-bottom:10px">${[...c.messages].map((m) => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}${c.routes.size ? miniEps([...c.routes]) : `<p class="hint" style="margin:0">Any endpoint, from ${esc(c.from)}.</p>`}</div></details>`).join('')}`;
  } else if (sub === 'config') {
    body = `<p class="hint">Validated with zod at start-up in ${srcLink('apps/api/src/config/env.ts')}; <code>.env.example</code> has comments and defaults.</p>
    <table class="env"><thead><tr><th>Variable</th><th>Default</th><th>Rule</th></tr></thead><tbody>${F.env.map((v) => `<tr><td>${esc(v.name)}${v.optional ? ' <span class="hint">optional</span>' : ''}</td><td>${v.default ? `<code>${esc(v.default)}</code>` : '—'}</td><td><code>${esc(v.rule)}</code>${v.doc ? `<div class="hint">${md(v.doc)}</div>` : ''}</td></tr>`).join('')}</tbody></table>`;
  } else if (sub === 'providers') {
    body = `<p class="hint">Every outside dependency sits behind an interface with a local implementation (${srcLink('apps/api/src/providers/index.ts')}). Tests replace them with fakes.</p>
    <ul class="rules">${F.providers.map((p) => `<li><b class="t">${esc(p.name)}</b><span>${p.methods.map((m) => `<code>${esc(m)}()</code>`).join(' ')}${p.doc ? ` · ${md(p.doc)}` : ''}</span><div style="margin-top:4px">${srcLink(p.file ?? 'apps/api/src/providers/index.ts', p.line)}</div></li>`).join('')}
    <li><b class="t">Storage</b><span><code>LocalDiskStorage</code>: signed upload URLs, raw and processed files under MEDIA_DIR. An <code>S3Storage</code> class replaces it in production.</span><div style="margin-top:4px">${srcLink('apps/api/src/lib/storage.ts')}</div></li></ul>`;
  } else if (sub === 'conventions') {
    body = `<ul class="rules">${G.conventions.map((c) => `<li><b>${esc(c.name)}</b><span>${md(c.text)}</span></li>`).join('')}</ul>
    <section class="block"><h2>Layering</h2><div class="flow">${['Route: HTTP only', 'zod schema', 'Service: SQL + rules', 'db/visibility.ts', 'Kysely → Postgres', 'emit() → outbox'].map((x, i, a) => `<div class="stage${i === a.length - 1 ? ' end' : ''}" style="--c:var(--a${i})"><b>${esc(x)}</b></div>`).join('')}</div></section>`;
  } else {
    body = `<p>This page is generated. Nothing in it is typed by hand except the module descriptions and the narrative in <code>.api-guide/guide.json</code>.</p>
    <ul class="bul">
      <li><b>Routes</b> come from the real app: <code>.api-guide/extract.mts</code> builds it with <code>buildApp()</code> (no listening, no database queries) and records every route Fastify registers, with its zod schemas as JSON Schema and its rate limit.</li>
      <li><b>Everything else</b> (functions called, tables, events, errors, audit actions, worker loops) comes from parsing <code>apps/api/src</code> and following each handler through the code. It reads code, not runtime behaviour, so a branch that never runs still counts.</li>
      <li>Read at <b>${esc(new Date(F.readAt).toLocaleString())}</b>. ${F.check.routesRuntime} routes registered, ${F.check.routesStatic} found in source${F.check.onlyRuntime.length ? ` (registered only: ${F.check.onlyRuntime.map((x) => `<code>${esc(x)}</code>`).join(', ')}, served by a plugin)` : ''}${F.check.onlyStatic.length ? `; <b>in source but not registered: ${F.check.onlyStatic.map((x) => `<code>${esc(x)}</code>`).join(', ')}</b>` : ''}.</li>
    </ul>
    <h3 style="margin-top:22px">Regenerate after changing the backend</h3>
    <pre class="code">node .api-guide/run.mjs</pre>
    <p class="hint" style="margin-top:8px">See <code>.api-guide/README.md</code>. The database schema has its own guide: <a href="schema-guide.html">schema-guide.html</a>.</p>`;
  }
  return `<h1>Reference</h1><nav class="tabs">${tabs.map(([id, label]) => `<a href="#ref/${id}" ${id === sub ? 'aria-current="page"' : ''}>${label}</a>`).join('')}</nav>${body}`;
};

// ------------------------------------------------------------ router
function route() {
  if (teardown) { teardown(); teardown = null; }
  const raw = decodeURIComponent(location.hash.slice(1) || '/');
  const [pathPart, query = ''] = raw.split('?');
  const params = new URLSearchParams(query);
  let name = 'home', arg = '';
  if (pathPart.startsWith('ep/')) { name = 'ep'; arg = pathPart.slice(3); }
  else if (pathPart.startsWith('journey')) { name = 'journey'; arg = pathPart.slice(8); }
  else {
    const [head, ...rest] = pathPart.replace(/^\//, '').split('/');
    if (views[head]) { name = head; arg = rest.join('/') || undefined; }
  }
  const navName = name === 'ep' ? 'endpoints' : name;
  document.querySelectorAll('nav.main a[data-v]').forEach((a) => { if (a.dataset.v !== navName) a.removeAttribute('aria-current'); else a.setAttribute('aria-current', 'page'); });
  app.className = name === 'journey' || name === 'ref' && arg === 'about' ? 'narrow' : '';
  app.innerHTML = views[name](arg, params);
  app.classList.remove('view-in'); void app.offsetWidth; app.classList.add('view-in');
  if (!(name === 'events' && arg)) window.scrollTo({ top: 0 });
  document.title = `${name === 'home' ? '' : (document.querySelector('#app h1')?.textContent || document.querySelector('.ep-title')?.textContent || name) + ' · '}Doshomik backend guide`;
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.closest('input,select,textarea')) {
    e.preventDefault();
    if (!document.getElementById('q')) location.hash = '#endpoints';
    setTimeout(() => document.getElementById('q')?.focus());
  }
});
document.getElementById('theme-toggle').addEventListener('click', () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('api-guide-theme', next); } catch (e) {}
});
document.getElementById('footer').innerHTML = `Generated from <code>apps/api</code> on ${esc(new Date(F.readAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }))} · ${F.routes.length} endpoints · <a href="#ref/about">how this page is made</a> · <a href="schema-guide.html">schema guide</a>`;
route();
</script>
</body>
</html>
